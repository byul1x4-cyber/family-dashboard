<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>화면 확인용 · 기기별 미리보기</title>
<style>
  body { margin: 0; padding: 14px; background: #EDE6D9; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; display: flex; gap: 14px; align-items: flex-start; }
  .frame { display: grid; gap: 6px; }
  .frame b { font-size: 12px; color: #7A6C5C; }
  iframe { border: 0; background: #fff; border-radius: 18px; box-shadow: 0 10px 26px rgba(120, 95, 60, .18); }
</style>
</head>
<body>
  <div class="frame"><b>폰 390px</b>
    <iframe src="preview.html?f=phone" width="390" height="844"></iframe>
  </div>
  <div class="frame"><b>태블릿 834px</b>
    <iframe src="preview.html?f=tablet" width="834" height="844"></iframe>
  </div>
<script>
  /* 주소에 붙인 조건(?view=routine 등)을 두 화면에 그대로 넘깁니다 */
  (function () {
    var q = (location.search || '').replace(/^\?/, '');
    if (!q) return;
    var frames = document.querySelectorAll('iframe');
    for (var i = 0; i < frames.length; i++) {
      frames[i].src = frames[i].getAttribute('src') + '&' + q;
    }
  })();
</script>
</body>
</html>
