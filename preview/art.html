<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>등교 그림 확인(임시)</title>
<style>
body{margin:0;background:#EDE9E1;font:700 12px/1.4 system-ui,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:10px;padding:12px}
.box{background:#fff;border-radius:14px;padding:8px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.box b{display:block;font-size:11px;color:#777;margin-bottom:4px}
.box svg{display:block;width:280px;height:auto;border-radius:12px}
</style></head>
<body>
<div class="wrap" id="wrap"></div>
<script src="../js/art.js?v=63"></script>
<script>
var kinds = ['wake','wash','dress','eat','bag'];
var html = '';
['minguk','ijun'].forEach(function (kid) {
  kinds.forEach(function (k) {
    html += '<div class="box"><b>' + kid + ' · ' + k + '</b>' + Art.schoolArt(k, kid) + '</div>';
  });
});
document.getElementById('wrap').innerHTML = html;
</script>
</body></html>
