<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#FFF7EC">
<title>우리집 다모아 · 가족 대시보드</title>
<meta name="description" content="아이 루틴 체크, 칭찬하기, 가족 일정, 우체통, 식판·약·성장 기록을 한 곳에 모은 우리집 가족 대시보드.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* =========================================================
   우리집 다모아 · 가족 대시보드
   '다!다!다!' 스타일 — 파스텔 카드 + 큼직한 그림 + 꽉 차는 레이아웃
   모바일 · 태블릿 · 데스크톱 반응형
   ========================================================= */

:root {
  --cream: #FFF8EA;
  --cream-2: #FFFDF7;
  --white: #FFFFFF;

  --ink: #4A3F35;
  --ink-soft: #7C6C5C;
  --ink-faint: #AC9E8D;
  --line: #F3E5CE;
  --line-strong: #EBD9BC;

  --mint: #5CC79C;
  --mint-soft: #E6F8EF;
  --mint-deep: #2C8563;

  --coral: #FF9A82;
  --coral-soft: #FFEDE7;
  --coral-deep: #C9603F;

  --lav: #A99BE6;
  --lav-soft: #F0ECFC;
  --lav-deep: #6A57C6;

  --sky: #6FB0E8;
  --sky-soft: #E8F3FE;
  --sky-deep: #3679B8;

  --sun: #F8BC45;
  --sun-soft: #FFF4D6;
  --sun-deep: #A5730E;

  --rose: #FF97C1;
  --rose-soft: #FFECF4;
  --rose-deep: #B4467A;

  --radius-xl: 30px;
  --radius-lg: 24px;
  --radius: 18px;
  --radius-sm: 13px;

  --shadow-sm: 0 2px 6px rgba(186, 152, 108, 0.10);
  --shadow: 0 10px 24px rgba(186, 152, 108, 0.14);
  --shadow-lg: 0 20px 44px rgba(170, 138, 96, 0.20);

  --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", "Noto Sans KR", "Helvetica Neue", sans-serif;
  --font-round: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", var(--font);
}

* { box-sizing: border-box; }

/* hidden 속성은 어떤 display 규칙보다도 우선합니다 */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(900px 460px at 100% -6%, #FFF1C9 0%, rgba(255, 241, 201, 0) 62%),
    radial-gradient(760px 460px at -8% 4%, #E9F9F1 0%, rgba(233, 249, 241, 0) 60%),
    radial-gradient(600px 380px at 50% 106%, #F4ECFF 0%, rgba(244, 236, 255, 0) 62%),
    var(--cream);
  background-attachment: fixed;
  min-height: 100vh;
  padding-bottom: 46px;
}

body.modal-open { overflow: hidden; }

h1, h2, h3, h4 { margin: 0; font-weight: 800; letter-spacing: -0.02em; }
p { margin: 0; }
button { font-family: inherit; color: inherit; cursor: pointer; }
a { color: var(--mint-deep); }
img { max-width: 100%; }
::selection { background: #FFE3A3; }

.app {
  max-width: 1280px;
  margin: 0 auto;
  padding: 12px 14px 0;
}

/* =========================================================
   상단 바 (컴팩트)
   ========================================================= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 9px 12px;
  margin: 0 0 10px;
  background: #FFFCF5;
  border: 2px solid #FFF2DD;
  border-radius: 24px;
  box-shadow: var(--shadow-sm);
}

.brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
.brand-mark {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  font-size: 20px;
  background: linear-gradient(150deg, #FFF0C6, #FFE0D8);
  border-radius: 13px;
  border: 2px solid #fff;
  flex: none;
}
.brand-text { min-width: 0; }
.brand-text h1 {
  font-family: var(--font-round);
  font-size: 21px;
  line-height: 1.1;
  color: #4B3A2B;
  white-space: nowrap;
  letter-spacing: 0;
}
.brand-text h1::first-letter { color: #E88B4C; }
.brand-text p {
  font-size: 11px;
  color: var(--ink-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.clock {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 10px;
  border-radius: 999px;
  background: linear-gradient(160deg, #FFFCF3, #FFF4DF);
  border: 2px solid #FBEBCB;
  line-height: 1.2;
}
.clock::before { content: "⏰"; font-size: 18px; }
.clock-in { display: grid; }
.clock-date { font-size: 10.5px; color: var(--ink-faint); }
.clock-time { font-size: 17px; font-weight: 800; color: #6B4B22; letter-spacing: 0.01em; }

.mode-bar { display: flex; align-items: center; gap: 6px; min-width: 0; }
.mode-switch {
  display: flex;
  gap: 4px;
  padding: 3px;
  background: #FBF1E1;
  border-radius: 999px;
  border: 1px solid #F4E5CE;
}
.mode-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink-soft);
  background: transparent;
  border: 0;
  border-radius: 999px;
  transition: background .18s, color .18s, box-shadow .18s;
  white-space: nowrap;
}
.mode-btn.active { background: #fff; box-shadow: var(--shadow-sm); }
.mode-btn.active[data-mode="child"] { color: var(--mint-deep); }
.mode-btn.active[data-mode="parent"] { color: var(--lav-deep); }

/* ⏰ 그만! 알림 · 📢 한마디 */
.stop-timer, .banner-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 2px solid #FBE2AC;
  background: linear-gradient(160deg, #FFF9E8, #FFEFCE);
  color: #8A5B10;
  font-size: 12.5px;
  font-weight: 800;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: transform .12s, box-shadow .18s, background .2s;
}
.stop-timer:hover, .banner-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.stop-timer .st-label { font-variant-numeric: tabular-nums; }
.stop-timer.running {
  background: linear-gradient(160deg, #FFE9E2, #FFD7C8);
  border-color: #FBC0AA;
  color: #B3402A;
  animation: stopPulse 1.8s ease-in-out infinite;
}
@keyframes stopPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 170, 140, .45); }
  50% { box-shadow: 0 0 0 8px rgba(255, 170, 140, 0); }
}
.banner-btn {
  border-color: #FBD3E3;
  background: linear-gradient(160deg, #FFF6FA, #FFE9F2);
  color: var(--rose-deep);
}

/* =========================================================
   탭
   ========================================================= */
.tabs {
  position: sticky;
  /* 상단 바의 실제 높이에 맞춰 JS(resize)가 --sticky-top 을 채웁니다.
     → 스크롤해도 탭 바가 헤더를 가리거나 본문을 가리지 않습니다. */
  top: var(--sticky-top, 66px);
  z-index: 30;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 5px 2px 9px;
  margin-bottom: 6px;
  scrollbar-width: none;
  /* 스크롤해서 본문이 탭 바 아래로 지나갈 때 글자가 비쳐 보이지 않게 불투명 띠 */
  background: #FFF9F1;
  border-radius: 0 0 16px 16px;
  box-shadow: 0 8px 12px -10px rgba(170, 140, 100, .45);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, 0.82);
  border: 2px solid #FFF3E1;
  border-radius: 999px;
  transition: transform .15s, background .18s, color .18s, border-color .18s;
  box-shadow: 0 1px 3px rgba(186, 152, 108, .08);
}
.tab span { font-size: 15px; }
.tab:hover { background: #fff; color: var(--ink); }
.tab.active {
  background: linear-gradient(160deg, #FFE9A8, #FFD06A);
  border-color: #FFDE95;
  color: #6B4A08;
  box-shadow: 0 6px 14px rgba(248, 188, 69, .26);
}
.tab:active { transform: scale(0.97); }
.tab.has-dot::after {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--coral);
  margin-left: -1px;
}

/* =========================================================
   공통
   ========================================================= */
.view { outline: none; }
.view-enter { animation: viewIn .3s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.card {
  background: var(--white);
  border: 2px solid #FFF5E6;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow);
  padding: 17px;
  position: relative;
}
.card.soft-mint { background: linear-gradient(165deg, #F1FCF7, #FFFFFF 62%); border-color: #DDF3E8; }
.card.soft-coral { background: linear-gradient(165deg, #FFF6F2, #FFFFFF 62%); border-color: #FFE3D9; }
.card.soft-sky { background: linear-gradient(165deg, #F4FAFF, #FFFFFF 62%); border-color: #DCEBF9; }
.card.soft-sun { background: linear-gradient(165deg, #FFFBEF, #FFFFFF 62%); border-color: #FCEBC5; }
.card.soft-lav { background: linear-gradient(165deg, #F8F5FF, #FFFFFF 62%); border-color: #E7E0F9; }
.card.soft-rose { background: linear-gradient(165deg, #FFF6FA, #FFFFFF 62%); border-color: #FBDDEB; }

.card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.card-head .ico {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  font-size: 18px;
  border-radius: 13px;
  background: var(--sun-soft);
  flex: none;
}
.card-head h2 { font-size: 16.5px; font-family: var(--font-round); font-weight: 400; letter-spacing: 0; }
.card-head .sub { font-size: 11.5px; color: var(--ink-faint); }
.card-head .spacer { flex: 1; }

.empty {
  padding: 18px 12px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 13px;
  background: #FEF9F0;
  border: 2px dashed #F2E3CC;
  border-radius: var(--radius);
  line-height: 1.7;
}
.empty .big { display: block; font-size: 22px; margin-bottom: 4px; }

.two-col { display: grid; gap: 14px; }
.duo-grid { display: grid; gap: 14px; margin-bottom: 14px; }
/* 설정 카드처럼 두 칸을 다 쓰는 카드 — 좁은 화면(1열)에서도 폭 전체를 쓰도록 1 / -1
   (span 2 로 두면 1열 그리드에 없는 둘째 열을 만들어 카드가 반 폭으로 갇힙니다) */
.span-2 { grid-column: 1 / -1; }
.lock-note {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px;
  background: #F6F2FF;
  border: 2px dashed #DFD6F8;
  border-radius: var(--radius);
  font-size: 12.5px;
  color: var(--lav-deep);
  margin-top: 10px;
}

/* 배지 · 칩 · 버튼 */
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 9px;
  font-size: 11px; font-weight: 800;
  border-radius: 999px;
  background: var(--sun-soft);
  color: #8A6414;
  white-space: nowrap;
}
.badge.mint { background: var(--mint-soft); color: var(--mint-deep); }
.badge.coral { background: var(--coral-soft); color: var(--coral-deep); }
.badge.lav { background: var(--lav-soft); color: var(--lav-deep); }
.badge.sky { background: var(--sky-soft); color: var(--sky-deep); }
.badge.sun { background: var(--sun-soft); color: #8A6414; }
.badge.rose { background: var(--rose-soft); color: var(--rose-deep); }

/* ⏰ 아침 체크 마감(아이 모드 · 등교 시각 이후) */
.badge.lock { background: #F1EEE9; color: #7E7469; }
.routine-item.locked {
  background: #FAF7F2;
  border-color: #E7E0D6;
  border-style: dashed;
  box-shadow: none;
  cursor: not-allowed;
}
.routine-item.locked .r-label { color: #9A9086; }
.routine-item.locked .r-emoji { opacity: .55; background: #F3EEE6; }
.routine-item.locked .routine-check.lock {
  border-style: dashed;
  border-color: #DED6CA;
  background: #F7F3EC;
  color: #8C8378;
  font-size: 15px;
}
.rg-locked .rg-head { opacity: .92; }

.chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 800;
  border-radius: 999px;
  border: 2px solid #F6E8D3;
  background: #fff;
  color: var(--ink-soft);
  transition: background .16s, color .16s, border-color .16s, transform .12s;
}
.chip:hover { transform: translateY(-1px); }
.chip.active { background: #4A3F35; color: #FFF8EA; border-color: #4A3F35; }
.chip.mint.active { background: var(--mint); border-color: var(--mint); color: #fff; }
.chip.coral.active { background: var(--coral); border-color: var(--coral); color: #fff; }
.chip.lav.active { background: var(--lav); border-color: var(--lav); color: #fff; }
.chip.sky.active { background: var(--sky); border-color: var(--sky); color: #fff; }
.chip.sun.active { background: var(--sun); border-color: var(--sun); color: #5B3E08; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 17px;
  font-size: 14px;
  font-weight: 800;
  border-radius: 999px;
  border: 2px solid transparent;
  background: #F8EFE3;
  color: var(--ink);
  transition: transform .12s, filter .18s, box-shadow .18s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(0.985); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(155deg, #77D4AC, #4FBF95); color: #fff; box-shadow: 0 7px 16px rgba(92, 199, 156, .32); }
.btn-lav { background: linear-gradient(155deg, #B4A7EC, #8E7BDC); color: #fff; box-shadow: 0 7px 16px rgba(169, 155, 230, .32); }
.btn-sun { background: linear-gradient(155deg, #FFD478, #F8B93E); color: #6B4A08; box-shadow: 0 7px 16px rgba(248, 188, 69, .3); }
.btn-rose { background: linear-gradient(155deg, #FFB2D0, #FF8DBB); color: #7A2E4C; box-shadow: 0 7px 16px rgba(255, 151, 193, .3); }
.btn-soft { background: #FBF2E6; color: var(--ink); border-color: #F5E6D1; }
.btn-ghost { background: #fff; color: var(--ink-soft); border-color: #F2E3CC; }
.btn-danger { background: #FFEDE8; color: #C4533C; border-color: #FFD8CE; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.icon-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 2px solid #F4E6D1;
  background: #fff;
  color: var(--ink-soft);
  font-size: 14px;
  flex: none;
}
.icon-btn:hover { background: #FFF9EC; }
.link-btn {
  background: none; border: 0; padding: 0;
  font-size: 12.5px; font-weight: 800;
  color: var(--mint-deep);
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* 입력 */
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; font-weight: 800; color: var(--ink-soft); margin-bottom: 5px; }
.input, .select, .textarea {
  width: 100%;
  padding: 11px 13px;
  font-family: inherit;
  font-size: 16px;
  color: var(--ink);
  background: #FFFDF8;
  border: 2px solid #F1E2CB;
  border-radius: 14px;
  outline: none;
  transition: border-color .16s, box-shadow .16s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--mint);
  box-shadow: 0 0 0 4px rgba(92, 199, 156, .15);
}
.textarea { resize: vertical; min-height: 76px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.help { font-size: 11.5px; color: var(--ink-faint); line-height: 1.7; }
.help code { background: #F8EFE1; border-radius: 6px; padding: 1px 5px; font-size: 11px; color: #8A6414; }
.err-text { color: #C4533C; }

/* 진행 바 */
.progress { display: block; height: 10px; background: #F6EBDA; border-radius: 999px; overflow: hidden; margin-top: 9px; }
.progress > i {
  display: block; height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #86D9B5, #C7F0DE);
  transition: width .4s ease;
}
.progress.coral > i { background: linear-gradient(90deg, #FFAB94, #FFD5C9); }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); margin-top: 5px; }

/* =========================================================
   홈 — 상단 날씨 · 부모님 상태
   ========================================================= */
.home-top {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 12px;
  margin-bottom: 12px;
  align-items: stretch;
}

.home-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
  margin-bottom: 12px;
  align-items: stretch;
}

/* ---- 오늘 날씨 카드 (지역 · 시간대별 · 미세먼지 · 옷차림) ---- */
.wx-card {
  display: grid;
  gap: 9px;
  padding: 13px 15px 12px;
  border-radius: 24px;
  background: linear-gradient(150deg, #EFF8FF, #FFFFFF 70%);
  border: 2px solid #DDECFB;
  box-shadow: var(--shadow-sm);
  min-width: 0;
}
.wx-card.rain { background: linear-gradient(150deg, #EAF3FD, #FFFFFF 72%); border-color: #D8E6F6; }
.wx-card.sun { background: linear-gradient(150deg, #FFF9E8, #FFFFFF 72%); border-color: #FBEBC6; }
.wx-card.snow { background: linear-gradient(150deg, #F2FAFF, #FFFFFF 72%); border-color: #DEEDF8; }
.wx-card.loading { display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 13px; font-weight: 700; padding: 18px; }
.wx-load { font-size: 13px; }

.wx-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.wx-place { display: flex; align-items: baseline; gap: 5px; font-size: 12px; font-weight: 800; color: var(--ink-soft); min-width: 0; }
.wx-place b { font-family: var(--font-round); font-weight: 400; font-size: 18px; color: #3E6E93; letter-spacing: 0; }
.wx-place small { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); }
.wx-now { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.wx-art { width: 56px; height: 56px; flex: none; }
.wx-svg { width: 100%; height: 100%; display: block; }
.wx-now-txt { min-width: 0; }
.wx-temp-line { display: flex; align-items: baseline; gap: 8px; }
.wx-temp { font-family: var(--font-round); font-size: 40px; line-height: 1; color: #3E6E93; letter-spacing: 0; }
.wx-temp small { font-size: 20px; margin-left: 1px; }
.wx-state { font-size: 13px; font-weight: 800; color: var(--ink-soft); }
.wx-range { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-faint); }
.wx-range b { color: #3E6E93; font-weight: 800; }

.wx-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.wx-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 9px; border-radius: 999px;
  background: rgba(255, 255, 255, .85);
  border: 1px solid #E6F0FA;
  font-size: 11px; font-weight: 800; color: var(--ink-soft);
  white-space: nowrap;
}
.wx-badge i { font-style: normal; font-size: 11px; }
.wx-badge b { color: #3E6E93; font-weight: 800; }
.wx-badge.dust.good { background: #E7F8EF; border-color: #CFEDDF; color: var(--mint-deep); }
.wx-badge.dust.good b { color: var(--mint-deep); }
.wx-badge.dust.normal { background: #EAF3FE; border-color: #D3E6FA; color: var(--sky-deep); }
.wx-badge.dust.normal b { color: var(--sky-deep); }
.wx-badge.dust.bad { background: #FFF0E2; border-color: #F8DFC4; color: #B4711B; }
.wx-badge.dust.bad b { color: #B4711B; }
.wx-badge.dust.worst { background: #FFE9E5; border-color: #F7D2CA; color: #C04A34; }
.wx-badge.dust.worst b { color: #C04A34; }

/* 시간대별 날씨 스트립 */
.wx-hours {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 1px;
}
.wx-hr {
  display: grid;
  justify-items: center;
  gap: 1px;
  padding: 7px 2px 6px;
  border-radius: 15px;
  background: rgba(255, 255, 255, .78);
  border: 1.5px solid #E3EFFA;
}
.wx-hr.now { background: linear-gradient(160deg, #FFF7DE, #FFFFFF); border-color: #FBE3A8; box-shadow: 0 3px 9px rgba(248, 188, 69, .22); }
.wx-hr-t { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); white-space: nowrap; }
.wx-hr-t i { font-style: normal; font-size: 8.5px; font-weight: 800; color: #B4711B; margin-left: 3px; }
.wx-hr.now .wx-hr-t { color: #A5730E; }
.wx-hr-i { font-size: 19px; line-height: 1.15; }
.wx-hr-tp { font-size: 13.5px; font-weight: 800; color: #3E6E93; }
.wx-hr-pop { font-size: 9.5px; font-weight: 800; color: #5B8FBF; min-height: 12px; white-space: nowrap; }

.wx-tip {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 800; color: #6B4B22;
  background: rgba(255, 255, 255, .82);
  border-radius: 14px;
  padding: 8px 11px;
  line-height: 1.4;
}
.wx-tip b { font-size: 10.5px; font-weight: 800; color: #A0763A; background: #FFF3D6; border-radius: 999px; padding: 3px 8px; flex: none; }

.status-rail { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-width: 0; }
.status-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  border-radius: 20px;
  background: #fff;
  border: 2px dashed #F2E2CB;
  text-align: left;
  min-width: 0;
  transition: transform .12s, box-shadow .18s, border-color .18s;
}
.status-chip:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.status-chip.set { border-style: solid; }
.status-chip.mom.set { background: linear-gradient(150deg, #FFF6FA, #FFFFFF 76%); border-color: #FBDCEA; }
.status-chip.dad.set { background: linear-gradient(150deg, #F2F9FF, #FFFFFF 76%); border-color: #DAEAFA; }
.sc-ava {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%; font-size: 17px;
  background: #FFF6E9;
  border: 2px solid #fff;
  box-shadow: var(--shadow-sm);
}
.sc-ava.lavender { background: var(--lav-soft); }
.sc-ava.sky { background: var(--sky-soft); }
.sc-txt { display: grid; min-width: 0; line-height: 1.25; }
.sc-txt b { font-size: 11.5px; color: var(--ink-faint); font-weight: 800; }
.sc-txt small { font-size: 12px; font-weight: 800; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-time { margin-left: auto; font-size: 10px; color: var(--ink-faint); white-space: nowrap; }

/* 상태 직접 적기 (모달) */
.status-write {
  margin-top: 14px;
  padding: 12px;
  border-radius: 16px;
  background: #FFF9F0;
  border: 2px dashed #F2E2CB;
}
.status-write-label { display: block; font-size: 12px; font-weight: 800; color: var(--ink-soft); margin-bottom: 7px; }
.status-write.on { border-style: solid; border-color: var(--mint); background: #F5FBF8; }
.status-write-row { display: flex; gap: 8px; align-items: stretch; }
.status-write-row .input { flex: 1; min-width: 0; padding: 9px 12px; font-size: 16px; }
.status-write-row .btn { flex: none; white-space: nowrap; }
.status-write-help { margin: 8px 0 0; font-size: 11px; color: var(--ink-faint); line-height: 1.45; }

/* =========================================================
   홈 — 아이 카드 (큼직)
   ========================================================= */
.home-kids { display: grid; gap: 6px; align-content: start; }
.home-children { display: grid; gap: 12px; }
.home-hint { font-size: 11px; color: var(--ink-faint); text-align: center; margin: 0; }

.kids-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

button.kid-card {
  width: 100%;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  border: 3px solid #fff;
  border-radius: 28px;
  padding: 14px 14px 0;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: transform .14s, box-shadow .2s, border-color .2s;
  position: relative;
}
button.kid-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
button.kid-card:active { transform: scale(.995); }
button.kid-card:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }

.kid-card { display: block; }
.kid-card.mint { background: linear-gradient(160deg, #DFF8EE, #F6FFFB 78%); }
.kid-card.coral { background: linear-gradient(160deg, #FFF0C9, #FFFDF3 78%); }
.kid-card.lav { background: linear-gradient(160deg, #EFEAFD, #FBFAFF 78%); }
.kid-card.sky { background: linear-gradient(160deg, #E2F1FE, #F8FCFF 78%); }
.kid-card.is-active { border-color: #FFD574; box-shadow: 0 0 0 4px rgba(255, 209, 116, .35), var(--shadow); }

.kc-top { display: flex; align-items: flex-start; gap: 12px; }
.kc-ava { width: 84px; height: 84px; flex: none; }
.kc-ava .ava-svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 8px rgba(150, 115, 80, .14)); }
.kc-info { min-width: 0; flex: 1; display: grid; gap: 2px; }
.kc-name { display: flex; align-items: baseline; gap: 6px; }
.kc-name strong { font-family: var(--font-round); font-weight: 400; font-size: 21px; letter-spacing: 0; color: #4B3A2B; }
.kc-name small { font-size: 10.5px; font-weight: 800; color: #fff; background: rgba(90, 75, 60, .3); border-radius: 999px; padding: 1px 7px; }
.kc-star { display: flex; align-items: center; gap: 3px; font-family: var(--font-round); font-size: 27px; line-height: 1.05; color: #C2831B; letter-spacing: 0; }
.kc-star em, .kc-star-num { font-style: normal; }
.kc-body { font-size: 11.5px; font-weight: 800; color: #7A6552; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kc-progress { display: flex; align-items: center; gap: 6px; margin-top: 4px; }

/* 오른쪽 동그란 진행 링 */
.kc-ring { 
  position: relative;
  width: 76px; height: 76px;
  flex: none;
  display: grid; place-items: center;
  color: #46B68C;
}
.kc-ring::before {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .72);
}
.kc-ring svg { position: relative; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.kc-ring .ring-bg { fill: none; stroke: currentColor; stroke-width: 8; opacity: .16; }
.kc-ring .ring-fg { fill: none; stroke: currentColor; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.kc-ring-txt { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; line-height: 1; gap: 2px; }
.kc-ring-txt b { font-family: var(--font-round); font-weight: 400; font-size: 21px; color: #2C7A58; }
.kc-ring-txt small { font-size: 9.5px; font-weight: 800; color: #6C8D7C; }
.kid-card.coral .kc-ring { color: #F0AE3D; }
.kid-card.coral .kc-ring-txt b { color: #9A6511; }
.kid-card.coral .kc-ring-txt small { color: #9A7B4A; }
.kc-progress .progress { flex: 1; margin: 0; height: 9px; background: rgba(255, 255, 255, .8); }
.kc-progress span { font-size: 10.5px; font-weight: 800; color: #7A6552; white-space: nowrap; }
.kc-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin: 11px -14px 0;
  padding: 8px 14px;
  background: rgba(255, 255, 255, .72);
  border-top: 2px solid rgba(255, 255, 255, .9);
  font-size: 12.5px;
  font-weight: 800;
  color: #6B5744;
}
.kc-foot b { color: #C2831B; font-size: 14px; }
.kc-foot .kc-go { font-size: 11px; color: #9A8874; font-weight: 700; }

/* =========================================================
   홈 — 타일 4개
   ========================================================= */
.tile-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}
.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 15px 13px 14px;
  border-radius: 26px;
  border: 3px solid #fff;
  box-shadow: var(--shadow);
  text-align: center;
  overflow: hidden;
  transition: transform .15s, box-shadow .2s;
  min-height: 140px;
}
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.tile:active { transform: scale(.99); }
.tile strong { font-family: var(--font-round); font-weight: 400; font-size: 17px; letter-spacing: 0; color: #4B3A2B; }
.tile small { font-size: 11.5px; font-weight: 700; color: #7C6C5C; line-height: 1.45; }
.tile .tile-art { width: 50px; height: 50px; display: block; filter: drop-shadow(0 3px 4px rgba(150, 118, 78, .18)); }
.tile.t-lav { background: linear-gradient(155deg, #F2EEFF, #FBF9FF 78%); }
.tile.t-rose { background: linear-gradient(155deg, #FFEDF5, #FFFAFC 78%); }
.tile.t-sun { background: linear-gradient(155deg, #FFF4D8, #FFFDF5 78%); }
.tile.t-mint { background: linear-gradient(155deg, #E6F9F0, #F9FFFC 78%); }
.tile.t-sky { background: linear-gradient(155deg, #E7F5FF, #F9FDFF 78%); }
.tile .q-badge {
  position: absolute;
  top: 12px; right: 12px;
  min-width: 24px; height: 24px;
  padding: 0 8px;
  display: grid; place-items: center;
  font-size: 11.5px; font-weight: 800;
  color: #fff;
  background: #FF8FAE;
  border-radius: 999px;
  box-shadow: 0 3px 8px rgba(255, 143, 174, .35);
}
.tile-kids { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
.tk-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px 2px 2px;
  border-radius: 999px;
  background: #fff;
  font-size: 11px; font-weight: 800; color: var(--ink-soft);
  box-shadow: var(--shadow-sm);
}
.tk-badge i {
  width: 20px; height: 20px;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 11px;
  font-style: normal;
}
.tk-badge.mint i { background: var(--mint-soft); }
.tk-badge.coral i { background: var(--coral-soft); }

/* 이만큼 자랐어요 (그림 카드) */
.tile.giraffe { padding: 0; justify-content: flex-end; align-items: stretch; text-align: left; }
.tile.giraffe .giraffe-wrap { position: absolute; inset: 0; display: block; }
.tile.giraffe .giraffe-svg { width: 100%; height: 100%; display: block; }
.tile.giraffe .giraffe-txt {
  display: block;
  position: relative;
  z-index: 1;
  padding: 10px 14px 12px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .82) 55%);
  width: 100%;
}
.tile.giraffe .giraffe-txt strong { display: block; color: #2F6B52; }
.tile.giraffe .giraffe-txt small { color: #4E7A67; }

/* =========================================================
   홈 — 아래 (달력 · 알림장 · 약 · 장보기)
   ========================================================= */
.home-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, .9fr);
  gap: 12px;
  align-items: start;
  margin-top: 2px;
}
.home-col { display: grid; gap: 12px; align-content: start; min-width: 0; }

.mini-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-bottom: 12px; }
.mini-dow { text-align: center; font-size: 10.5px; font-weight: 800; color: var(--ink-faint); padding: 2px 0 5px; }
.mini-dow.sun { color: var(--coral); }
.mini-dow.sat { color: #6E9FD6; }
.mini-day {
  position: relative;
  min-height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 11px;
  border: 2px solid transparent;
  background: #FFFAF1;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-soft);
  padding: 0;
  transition: transform .12s, background .16s;
}
.mini-day:hover { transform: translateY(-1px); background: #FFF3DD; }
.mini-day.outside { color: #DDD0C0; background: transparent; }
.mini-day.has-ev { background: #FFF7E3; border-color: #F8E7C1; color: #8A5B10; }
.mini-day.today { background: #FFD46F; color: #6B4A08; border-color: #FFC94A; box-shadow: 0 0 0 3px rgba(255, 212, 111, .3); }
.mini-day .mini-dot {
  position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 999px; background: var(--mint);
}
.mini-dot.coral { background: var(--coral); }
.mini-dot.lav { background: var(--lav); }
.mini-dot.sky { background: var(--sky); }
.mini-dot.sun { background: var(--sun); }
.mini-dot.mint { background: var(--mint); }
.mini-sub { font-size: 12.5px; font-weight: 800; color: var(--ink-soft); margin: 2px 0 8px; }
.home-cal-card .ev-item { padding: 8px 10px; }
.home-cal-card .ev-title { font-size: 12.5px; }

/* 민국이 알림장 */
.notice-card { display: block; }
.notice-card.kid { background: linear-gradient(165deg, #FFFDF4, #FFFFFF 66%); }
.notice-title { font-family: var(--font-round); font-weight: 400; font-size: 16px; letter-spacing: 0; color: #4B3A2B; margin-bottom: 4px; }
.notice-msg { font-size: 12.5px; font-weight: 700; color: #6B5744; background: #FFF7E6; border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
.notice-list { display: grid; gap: 6px; }
.notice-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px;
  border-radius: 14px;
  border: 2px solid #F5E7D2;
  background: #FFFDF8;
  text-align: left;
  font-size: 13px;
  font-weight: 700;
  transition: background .16s, border-color .16s;
}
.notice-item .notice-check {
  width: 24px; height: 24px; flex: none;
  border-radius: 50%;
  border: 2px solid #EBDCBF;
  display: grid; place-items: center;
  font-size: 13px;
  color: #fff;
  background: #fff;
}
.notice-item.done { background: #F1FBF6; border-color: #CFEBDD; }
.notice-item.done .notice-check { background: var(--mint); border-color: var(--mint); }
.notice-item.done .notice-text { color: var(--mint-deep); text-decoration: line-through; text-decoration-color: #A9DCC5; }
.notice-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
.notice-foot .hint { font-size: 11px; color: var(--ink-faint); }
.notice-empty { padding: 14px; font-size: 12.5px; }

/* 약 · 장보기 */
.med-mini-list { display: grid; gap: 7px; }
.med-mini {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: 14px;
  background: #FFF9F1;
  border: 2px solid #F7E9D6;
  font-size: 12.5px;
  font-weight: 800;
}
.med-mini .mm-ava {
  width: 26px; height: 26px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%; background: #fff; font-size: 13px;
}
.med-mini .mm-time { margin-left: auto; font-size: 11px; color: var(--ink-faint); font-weight: 700; }
.med-mini.done { background: #F1FBF6; border-color: #CFEBDD; }
.med-mini.done .mm-name { color: var(--mint-deep); }

.shop-add { display: flex; gap: 6px; margin-bottom: 9px; }
.shop-add .input { flex: 1; padding: 9px 12px; font-size: 16px; }
.shop-add .btn { padding: 9px 13px; font-size: 13px; }
.shop-list { display: grid; gap: 6px; }
.shop-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: 14px;
  border: 2px solid #F4E6D1;
  background: #FFFDF8;
}
.shop-item .shop-check {
  width: 26px; height: 26px; flex: none;
  border-radius: 50%;
  border: 2px solid #EBDCBF;
  background: #fff;
  display: grid; place-items: center;
  font-size: 13px; color: transparent;
  transition: background .16s, border-color .16s, transform .12s;
}
.shop-item .shop-check:hover { border-color: var(--mint); transform: scale(1.06); }
.shop-text { flex: 1; font-size: 13px; font-weight: 800; color: var(--ink); min-width: 0; }
.shop-by { font-size: 10.5px; color: var(--ink-faint); font-weight: 700; }
.shop-del { background: none; border: 0; color: #C9B9A5; font-size: 13px; padding: 2px 4px; }
.shop-item.done { background: #F2FBF6; border-color: #CFEBDD; }
.shop-item.done .shop-check { background: var(--mint); border-color: var(--mint); color: #fff; }
.shop-item.done .shop-text { color: var(--mint-deep); text-decoration: line-through; text-decoration-color: #A9DCC5; }

/* =========================================================
   📢 태블릿에 한마디 (부모님)
   ========================================================= */
.banner-compose {
  background: linear-gradient(160deg, #FFF6FA, #FFFDFF 68%);
  border-color: #FBDCEA;
  margin-bottom: 12px;
}
.bc-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.bc-ico {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  font-size: 19px;
  border-radius: 14px;
  background: linear-gradient(155deg, #FFD9E8, #FFC0D8);
  box-shadow: 0 5px 12px rgba(255, 151, 193, .28);
}
.bc-head h2 { font-family: var(--font-round); font-weight: 400; font-size: 17px; letter-spacing: 0; color: #8A3357; }
.bc-head p { font-size: 11.5px; color: #A8738C; }
.bc-row { display: flex; gap: 7px; flex-wrap: wrap; }
.bc-row .select { width: auto; flex: none; padding: 10px 10px; font-size: 16px; }
.bc-row .input { flex: 1; min-width: 160px; }
.bc-quick { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.bc-quick .chip { font-size: 11.5px; padding: 5px 10px; background: #fff; }
.bc-state {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-top: 9px;
  padding: 8px 11px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .8);
  border: 2px dashed #F8D7E5;
  font-size: 11.5px;
  font-weight: 700;
  color: #8A3357;
}
.bc-state.empty { justify-content: center; color: #B79CA6; }

/* =========================================================
   할 일 (루틴)
   ========================================================= */
.time-banner {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 16px 18px;
  border-radius: 26px;
  margin-bottom: 12px;
  border: 3px solid #fff;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  color: #4B3A2B;
}
.time-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(300px 120px at 88% 10%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 70%);
  pointer-events: none;
}
.time-banner.morning { background: linear-gradient(150deg, #FFE9AE, #FFD08B 60%, #FFB9A2); color: #6B4415; }
.time-banner.day { background: linear-gradient(150deg, #CDEEFF, #E8F7FF 60%, #FFF6DC); color: #2F6480; }
.time-banner.evening { background: linear-gradient(150deg, #A79BE8, #8B7BD8 55%, #6E5FC0); color: #fff; }
.time-banner.night { background: linear-gradient(150deg, #6A5BAE, #4E4189 60%, #3A3168); color: #fff; }
.tb-art-svg { width: 66px; height: 66px; flex: none; filter: drop-shadow(0 4px 8px rgba(120, 90, 40, .16)); }
.time-banner .tb-text { display: grid; gap: 2px; min-width: 0; }
.time-banner .tb-text b { font-family: var(--font-round); font-weight: 400; font-size: 24px; letter-spacing: 0; line-height: 1.15; }
.time-banner .tb-text span { font-size: 12px; font-weight: 700; opacity: .82; }
.time-banner .tb-right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.time-banner .tb-pill {
  padding: 6px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .72);
  font-size: 12px;
  font-weight: 800;
  color: #4B3A2B;
  white-space: nowrap;
}
.time-banner.evening .tb-pill, .time-banner.night .tb-pill { background: rgba(255, 255, 255, .22); color: #fff; }

.routine-card { margin-bottom: 12px; }
.routine-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.routine-head strong { font-family: var(--font-round); font-weight: 400; font-size: 17px; letter-spacing: 0; }
.routine-kid { padding: 15px; border-radius: 28px; }
.routine-kid.mint { background: linear-gradient(165deg, #EAFBF3, #FFFFFF 62%); border-color: #D5F2E5; }
.routine-kid.coral { background: linear-gradient(165deg, #FFF4DA, #FFFFFF 62%); border-color: #FBE7BE; }
.routine-kid.lav { background: linear-gradient(165deg, #F2EEFF, #FFFFFF 62%); border-color: #E3DBF9; }
.routine-kid.sky { background: linear-gradient(165deg, #EAF5FF, #FFFFFF 62%); border-color: #D8E9F8; }
.rk-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rk-head strong { font-family: var(--font-round); font-weight: 400; font-size: 19px; letter-spacing: 0; }
.rk-head .avatar { width: 42px; height: 42px; }
.rk-spacer { flex: 1; }
.rk-done { font-size: 12px; font-weight: 800; color: #8A755C; }

.avatar {
  width: 56px; height: 56px;
  display: grid; place-items: center;
  font-size: 26px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid #fff;
  box-shadow: var(--shadow-sm);
  flex: none;
}
.avatar.sm { width: 38px; height: 38px; font-size: 19px; border-width: 2px; }
/* 아이 아바타 — 남자아이 그림 캐릭터 */
.avatar.ava-kid { padding: 0; overflow: hidden; background: #fff; }
.avatar.ava-kid .ava-svg { width: 100%; height: 100%; display: block; }
.avatar.mint { background: var(--mint-soft); }
.avatar.coral { background: var(--coral-soft); }
.avatar.lav { background: var(--lav-soft); }
.avatar.sky { background: var(--sky-soft); }
.avatar.sun { background: var(--sun-soft); }

.routine-group + .routine-group { margin-top: 14px; }
.routine-group h3, .rg-head {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 800; color: #7C6C5C;
  margin-bottom: 8px;
}
.routine-group h3 span, .rg-head span.ico { font-size: 15px; }
.routine-list { display: grid; gap: 8px; }

.routine-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px 9px 12px;
  border: 2px solid #F5E7D2;
  border-radius: 20px;
  background: #fff;
  font: inherit;
  text-align: left;
  box-shadow: 0 2px 5px rgba(186, 152, 108, .07);
  transition: background .18s, border-color .18s, transform .12s;
}
button.routine-item:hover { transform: translateY(-1px); border-color: #F0D9B8; }
button.routine-item:active { transform: scale(.995); }
.routine-item .r-emoji {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  border-radius: 13px;
  background: #FFFAF1;
  font-size: 19px;
}
.routine-item .r-label { flex: 1; font-weight: 800; font-size: 14.5px; min-width: 0; }
.routine-item .r-main {
  display: flex; align-items: center; gap: 10px;
  flex: 1; min-width: 0;
  background: none; border: 0; padding: 0;
  font: inherit; text-align: left; color: inherit;
}
.r-del {
  flex: none;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 2px solid #F6E0D8;
  background: #FFF6F3;
  font-size: 13px;
  opacity: .85;
}
.r-del:hover { background: #FFE9E3; opacity: 1; }
.routine-add-btn { width: 100%; margin-top: 12px; border-style: dashed; border-width: 2px; border-color: #E9D9C2; }

/* 할 일 추가 모달: 아이콘 고르기 */
.rt-emoji-row { display: flex; flex-wrap: wrap; gap: 5px; }
.rt-emoji {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 12px;
  border: 2px solid #F3E6D3;
  background: #fff;
  font-size: 18px;
  transition: transform .12s, border-color .16s, background .16s;
}
.rt-emoji:hover { transform: translateY(-1px); background: #FFF9EE; border-color: #EBD6B6; }
.routine-item .r-time { display: block; font-size: 10.5px; color: var(--ink-faint); font-weight: 600; }
.routine-check {
  width: 40px; height: 40px; flex: none;
  border-radius: 50%;
  border: 3px solid #EFDFC6;
  background: #fff;
  display: grid; place-items: center;
  font-size: 19px;
  font-weight: 800;
  color: transparent;
  transition: background .18s, border-color .18s, transform .12s;
}
button.routine-item:hover .routine-check { border-color: var(--mint); transform: scale(1.05); }
.routine-item.done { background: #F3FCF7; border-color: #D3EDE0; }
.routine-item.done .r-label { color: var(--mint-deep); }
.routine-item.done .r-emoji { background: #E6F8EF; }
.routine-check.on { background: var(--mint); border-color: var(--mint); color: #fff; }
.routine-item.coral .routine-check.on, .routine-kid.coral .routine-check.on { background: #FFA98F; border-color: #FFA98F; }

/* =========================================================
   칭찬하기
   ========================================================= */
.praise-kid { padding: 15px; }
.praise-kid.mint { background: linear-gradient(165deg, #EAFBF3, #FFFFFF 62%); border-color: #D5F2E5; }
.praise-kid.coral { background: linear-gradient(165deg, #FFF4DA, #FFFFFF 62%); border-color: #FBE7BE; }
.praise-items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.praise-item {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 11px;
  border: 2px solid #F5E7D2;
  border-radius: 16px;
  background: #fff;
  font-size: 12.5px; font-weight: 800;
  text-align: left;
  transition: transform .12s, background .18s, border-color .18s;
}
.praise-item span { font-size: 18px; }
.praise-item:hover { background: #FFF9EA; border-color: #F3DFB9; transform: translateY(-1px); }
.praise-item:active { transform: scale(.98); }

.log-list { display: grid; gap: 6px; }
.log-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px;
  background: #FFFCF6;
  border: 2px solid #F5E8D5;
  border-radius: 14px;
  font-size: 12.5px;
}
.log-item .l-main { flex: 1; min-width: 0; }
.log-item .l-main b { font-weight: 800; }
.log-item .l-time { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }

/* 칭찬 취소 — 부모님 모드의 최근 칭찬 기록에만 붙는 작은 버튼 */
.log-cancel {
  flex: none;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1.5px solid #F0DCC6;
  background: #fff;
  color: var(--ink-faint);
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  transition: background .15s, color .15s, border-color .15s, transform .12s;
}
.log-cancel:hover { background: #FFEDE8; border-color: #FFD8CE; color: #C4533C; }
.log-cancel:active { transform: scale(.96); }

/* =========================================================
   우리 가족 일정
   ========================================================= */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-title { font-family: var(--font-round); font-weight: 400; font-size: 19px; letter-spacing: 0; flex: 1; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 800; color: var(--ink-faint); padding: 4px 0; }
.cal-dow.sun { color: #E2735C; }
.cal-dow.sat { color: #5B8FC9; }
.cal-day {
  position: relative;
  aspect-ratio: 1 / 1;
  min-height: 42px;
  border-radius: 15px;
  border: 2px solid transparent;
  background: #FFFAF1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 13px;
  font-weight: 800;
  padding: 2px;
  transition: background .15s, border-color .15s, transform .12s;
}
.cal-day:hover { background: #FFF2DC; transform: translateY(-1px); }
.cal-day.outside { opacity: .34; }
.cal-day.today { border-color: #FFC94A; background: #FFF8E3; }
.cal-day.selected { background: #FFD46F; color: #6B4A08; border-color: #FFC94A; }
.cal-day.selected .cal-dot { outline: 1px solid rgba(255, 255, 255, .6); }
.cal-day .cal-dots { display: flex; gap: 2px; height: 5px; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; }
.cal-dot.mint { background: var(--mint); }
.cal-dot.coral { background: var(--coral); }
.cal-dot.lav { background: var(--lav); }
.cal-dot.sky { background: var(--sky); }
.cal-dot.sun { background: var(--sun); }
.cal-day.selected .cal-num { color: #6B4A08; }

.ev-list { display: grid; gap: 8px; }
.ev-item {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 10px 12px;
  border: 2px solid #F5E7D2;
  border-left: 5px solid var(--mint);
  border-radius: 16px;
  background: #FFFDF8;
}
.ev-item.coral { border-left-color: var(--coral); }
.ev-item.lav { border-left-color: var(--lav); }
.ev-item.sky { border-left-color: var(--sky); }
.ev-item.sun { border-left-color: var(--sun); }
.ev-main { flex: 1; min-width: 0; }
.ev-title { font-weight: 800; font-size: 13.5px; }
.ev-meta { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.ev-type { font-size: 10.5px; font-weight: 800; color: #8A7358; background: #FBF2E4; border-radius: 999px; padding: 1px 7px; }
.ev-dday { font-weight: 800; font-size: 12px; color: var(--mint-deep); white-space: nowrap; }
.ev-dday.today { color: var(--coral-deep); }

/* 🎒 준비물 */
.prep-row { margin-top: 7px; display: grid; gap: 4px; }
.prep-label { font-size: 10.5px; font-weight: 800; color: #A9711B; }
.prep-label b { color: var(--mint-deep); margin-left: 3px; }
.prep-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.prep-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 9px 4px 5px;
  border-radius: 999px;
  border: 2px solid #F6E4C6;
  background: #FFFBF2;
  font-size: 11.5px; font-weight: 800;
  color: #7A5B25;
  transition: background .14s, border-color .14s, transform .12s;
}
.prep-chip:hover { transform: translateY(-1px); border-color: #EFD3A4; }
.prep-chip .prep-box {
  width: 17px; height: 17px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 2px solid #EBD9B8;
  background: #fff;
  font-size: 10px; color: transparent;
}
.prep-chip.done { background: #F2FBF6; border-color: #CFEBDD; color: var(--mint-deep); }
.prep-chip.done .prep-box { background: var(--mint); border-color: var(--mint); color: #fff; }
.prep-chip.done { text-decoration: none; }

/* =========================================================
   우체통
   ========================================================= */
.mail-layout { display: grid; gap: 14px; }
.mail-compose-card { padding: 14px 15px; }
.pick-child { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.pick-child button {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px 8px 8px;
  border-radius: 999px;
  border: 2px solid #F5E7D2;
  background: #fff;
  font-weight: 800; font-size: 13px;
  color: var(--ink-soft);
}
.pick-child button.active { border-color: var(--mint); background: #F1FBF6; color: var(--mint-deep); }
.pick-child button.active.coral { border-color: var(--coral); background: #FFF6F0; color: var(--coral-deep); }

.mail-recipients { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.mail-recipient {
  padding: 12px 6px;
  border-radius: 18px;
  border: 2px solid #F5E7D2;
  background: #fff;
  text-align: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-soft);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform .12s, background .16s, border-color .16s;
}
.mail-recipient .emoji { font-size: 24px; }
.mail-recipient:hover { transform: translateY(-1px); }
.mail-recipient.active { border-color: var(--rose); background: #FFF4F9; color: var(--rose-deep); box-shadow: 0 6px 14px rgba(255, 151, 193, .18); }

/* ✏️ 편지 쓰기 — 모두 한눈에 보이되 세로로 짧게 (넓은 화면은 글쓰기·음성·그림 | 손글씨 2열) */
.mail-who { display: grid; gap: 5px; margin-bottom: 9px; }
.mail-who-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.mail-who-label { flex: none; width: 56px; font-size: 11px; font-weight: 800; color: var(--ink-faint); }
.pick-child.mail-pick { margin-bottom: 0; flex: 1; flex-wrap: nowrap; gap: 6px; min-width: 0; }
.pick-child.mail-pick button { padding: 3px 10px 3px 3px; font-size: 12px; gap: 5px; }
.pick-child.mail-pick button .avatar { width: 24px; height: 24px; font-size: 13px; }
.mail-recipients.compact { display: flex; flex: 1; gap: 6px; }
.mail-recipients.compact .mail-recipient { flex: 0 1 150px; flex-direction: row; justify-content: center; gap: 5px; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
.mail-recipients.compact .mail-recipient .emoji { font-size: 15px; }
.mail-compose-grid { display: grid; gap: 9px; align-items: start; }
.mail-compose-left { display: grid; gap: 7px; min-width: 0; }
/* ✍️ 글 칸 + 🎤 한 묶음 — 입력칸 바로 밑에 붙어 '말하면 이 칸에 적힌다'가 한눈에 보입니다 */
.mail-say {
  display: grid;
  border-radius: 16px;
  background: #FFFDF8;
  border: 2px solid #F1E2CB;
  overflow: hidden;
  transition: border-color .16s, box-shadow .16s;
}
.mail-say:focus-within { border-color: var(--mint); box-shadow: 0 0 0 4px rgba(92, 199, 156, .15); }
.mail-say .mail-text {
  border: 0; border-radius: 0; background: transparent; box-shadow: none;
  min-height: 48px; padding: 9px 11px 7px; font-size: 16px; line-height: 1.45; resize: none;
}
.mail-say .mail-text:focus { border: 0; box-shadow: none; }
.mail-ornament { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.mail-ornament small { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); }
.mail-compose-left .picto-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.mail-compose-left .picto { padding: 6px 2px; border-radius: 12px; font-size: 10px; gap: 2px; }
.mail-compose-left .picto .emoji { font-size: 19px; }
.mail-compose-right .hw-block { margin-top: 0; padding: 9px; border-radius: 18px; }
.mail-compose-right .hw-head { margin-bottom: 5px; }
.mail-compose-right .hw-head b { font-size: 15px; }
.mail-compose-right .hw-head span { font-size: 10.5px; }
.mail-compose-right .hw-tools { gap: 5px; margin-bottom: 6px; }
.mail-compose-right .hw-swatch { width: 22px; height: 22px; border-width: 2px; }
.mail-compose-right .hw-size, .mail-compose-right .hw-eraser, .mail-compose-right .hw-clear { padding: 3px 8px; font-size: 10.5px; }
.mail-compose-right .hw-hint { font-size: 12px; }

.picto-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.picto {
  padding: 13px 5px;
  border-radius: 18px;
  border: 2px solid #FFF;
  background: #F4F9FF;
  font-size: 11.5px;
  font-weight: 800;
  color: #4E6E8A;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  transition: transform .12s, background .16s, box-shadow .18s;
  box-shadow: var(--shadow-sm);
}
.picto .emoji { font-size: 26px; }
.picto:nth-child(3n+1) { background: #F0F6FF; color: #3F6C93; }
.picto:nth-child(3n+2) { background: #F4F0FF; color: #5C4FA0; }
.picto:nth-child(3n+3) { background: #FFF0F6; color: #A8466F; }
.picto.active { border-color: var(--sun); background: #FFF7E2; color: #8A6414; box-shadow: 0 8px 18px rgba(248, 188, 69, .24); transform: translateY(-2px); }
.picto:active { transform: scale(.97); }

/* 🎤 눌러서 말하기 — 글 칸 밑에 딱 붙은 컴포넌트 바 (말한 내용이 위 칸에 적힘) */
.mic-btn {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  margin: 0;
  padding: 7px 11px 8px;
  border: 0;
  border-top: 1.5px dashed #F8CFDF;
  border-radius: 0;
  background: linear-gradient(180deg, #FFF4F9, #FFE2EF);
  text-align: left;
  box-shadow: none;
  transition: background .2s, filter .2s;
}
.mic-btn:hover { filter: brightness(1.02); }
.mic-btn:active .mic-ico { transform: scale(.94); }
.mic-btn .mic-ico {
  width: 30px; height: 30px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 15px;
  background: #fff;
  box-shadow: 0 2px 6px rgba(180, 70, 120, .2);
  transition: transform .12s;
}
.mic-btn .mic-text { display: flex; align-items: baseline; gap: 7px; min-width: 0; flex: 1; }
.mic-btn .mic-text b { flex: none; font-family: var(--font-round); font-weight: 400; font-size: 14.5px; letter-spacing: 0; color: #7A2E4C; }
.mic-btn .mic-text small { font-size: 10.5px; color: #A2557A; font-weight: 700; min-width: 0; }
.mic-btn.on { background: linear-gradient(180deg, #FFE7F2, #FFC9DE); }
.mic-btn.on .mic-text b { color: #B4245F; }
.mic-btn.on .mic-ico { animation: micIco 1s infinite; background: #FFF0F6; }
@keyframes micIco {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 90, 150, .5); }
  50% { box-shadow: 0 0 0 7px rgba(255, 90, 150, 0); }
}
@keyframes micPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 130, 175, .5); }
  50% { box-shadow: 0 0 0 12px rgba(255, 130, 175, 0); }
}

.mail-compose-foot { display: flex; align-items: center; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
.mail-compose-foot .counter { font-size: 11.5px; color: var(--ink-faint); flex: 1; white-space: nowrap; }

/* 이동한 편지 말풍선을 잠깐 반짝 */
.mail-flash { animation: mailFlash 1.8s ease-out; border-radius: 18px; }
@keyframes mailFlash {
  0%, 55% { background: #FFF7DC; box-shadow: 0 0 0 3px rgba(248, 188, 69, .5); }
  100% { background: transparent; box-shadow: 0 0 0 3px rgba(248, 188, 69, 0); }
}

/* 가족방 말풍선 */
.room-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.room-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 2px solid #F5E7D2;
  background: #fff;
  font-size: 12.5px; font-weight: 800;
  color: var(--ink-soft);
  transition: transform .12s, background .16s, border-color .16s;
}
.room-chip:hover { transform: translateY(-1px); }
.room-chip i {
  font-style: normal; font-size: 10.5px; font-weight: 800;
  background: #F6EBDE; color: #9A8574;
  border-radius: 999px; padding: 1px 6px;
}
.room-chip.active { background: linear-gradient(160deg, #FFE6F1, #FFD0E2); border-color: #FBB6D2; color: #8A3357; }
.room-chip.active i { background: rgba(255, 255, 255, .85); color: #B4467A; }

.chat-room { display: grid; gap: 14px; }
.chat-group { display: grid; gap: 8px; }
.chat-thread {
  display: grid; gap: 10px;
  padding: 11px;
  background: linear-gradient(180deg, #FFFCF6, #FFF7EA);
  border: 2px solid #F5E8D5;
  border-radius: 20px;
  max-height: 480px;
  overflow-y: auto;
}
.chat-row { display: flex; gap: 7px; align-items: flex-start; }
.chat-row.me { justify-content: flex-end; }
.chat-ava {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 999px; font-size: 17px;
  background: var(--mint-soft); border: 2px solid #fff;
  box-shadow: var(--shadow-sm);
}
.chat-ava.coral { background: var(--coral-soft); }
.chat-col { max-width: 86%; display: grid; gap: 3px; }
.chat-arrow { color: #C9B9A5; font-weight: 800; font-size: 10.5px; }
.chat-ava.parent { background: #FFF2E2; }
.chat-thread.family { max-height: 540px; }
.chat-quick { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.qreply {
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 800;
  border-radius: 999px;
  border: 1.5px solid #F3D9E5;
  background: #FFF9FC;
  color: #A2557A;
  transition: background .14s, border-color .14s, transform .12s;
}
.qreply:hover { background: #FFEFF6; border-color: #F7C6DC; transform: translateY(-1px); }
.qreply:active { transform: scale(.97); }
.chat-col.right { justify-items: end; }
.chat-meta { display: flex; gap: 5px; align-items: baseline; font-size: 11px; color: var(--ink-faint); }
.chat-meta b { font-size: 11.5px; color: var(--ink-soft); }
.chat-meta .chat-time { font-size: 10.5px; }
.chat-bubble { position: relative; padding: 10px 12px; border-radius: 18px; font-size: 13px; line-height: 1.5; box-shadow: var(--shadow-sm); }
.chat-bubble.them { background: #fff; border: 2px solid #F5E8D5; border-top-left-radius: 6px; }
.chat-bubble.me {
  background: linear-gradient(160deg, #FFF3D8, #FFEBC8);
  border: 2px solid #F6E0B4; border-top-right-radius: 6px;
  color: #6B4A16;
}
.chat-pictos { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
.chat-picto {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 8px; border-radius: 999px;
  background: #F4FBF8; border: 1px solid #DDEFE5;
  font-size: 11px; font-weight: 800; color: var(--mint-deep);
}
.chat-text { white-space: pre-wrap; }
.chat-speak {
  position: absolute; right: 6px; bottom: -10px;
  width: 26px; height: 26px; border-radius: 999px;
  border: 2px solid #F3E5D0; background: #fff;
  font-size: 11px; line-height: 1; display: grid; place-items: center;
  box-shadow: var(--shadow-sm);
}
.chat-replybar {
  margin-top: 10px;
  padding: 11px;
  border-radius: 20px;
  background: #FFFCF6;
  border: 2px solid #F3E5D0;
  display: grid; gap: 8px;
}
.crb-to { font-size: 11.5px; color: var(--ink-faint); }
.crb-to b { color: var(--ink-soft); }
.crb-quick { flex-wrap: wrap; }
.crb-quick .chip { font-size: 11.5px; padding: 6px 10px; }
.crb-input { display: flex; gap: 6px; }
.crb-input .input { flex: 1; }
.inbox-head { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); padding: 4px 2px; }
.inbox-head .inbox-emoji { font-size: 17px; }
.inbox-head strong { font-size: 13px; }
.inbox-empty { padding: 13px; font-size: 12px; }
.mail-room { padding: 18px; }

/* =========================================================
   식판 · 건강
   ========================================================= */
.tray {
  background: linear-gradient(160deg, #FFFCF3, #FFF7E9);
  border: 3px solid #F3E2C5;
  border-radius: 26px;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-areas: "s1 s2 s3" "rice soup soup";
  grid-template-rows: 1fr 1fr;
  grid-auto-rows: 1fr;
  gap: 8px;
  min-height: 220px;
}
.tray-slot {
  border-radius: 18px;
  background: #fff;
  border: 2px solid #F1E3CE;
  padding: 10px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: center;
  min-height: 88px;
  justify-content: center;
}
.tray-slot.s1 { grid-area: s1; } .tray-slot.s2 { grid-area: s2; } .tray-slot.s3 { grid-area: s3; }
.tray-slot.rice { grid-area: rice; } .tray-slot.soup { grid-area: soup; }
.tray-slot .slot-label { font-size: 10.5px; color: var(--ink-faint); font-weight: 800; }
.tray-slot .dish { font-size: 24px; line-height: 1.1; }
.tray-slot .dish-name { font-size: 12px; font-weight: 800; }
.tray-slot .dish-name.none { color: var(--ink-faint); font-weight: 700; }
.dish-btn { background: none; border: 0; display: grid; gap: 3px; justify-items: center; padding: 2px; }

.meal-kid { padding: 15px; }
.meal-kid.mint { background: linear-gradient(165deg, #EAFBF3, #FFFFFF 62%); border-color: #D5F2E5; }
.meal-kid.coral { background: linear-gradient(165deg, #FFF4DA, #FFFFFF 62%); border-color: #FBE7BE; }
.mk-row {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 8px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 2px dashed #F5E7D2;
}
.mk-row:last-of-type { border-bottom: 0; }
.mk-dish { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.mk-dish span { font-size: 17px; }
.mk-row .level-row { margin: 0; }
.mk-row .level-pill { font-size: 11px; padding: 5px 7px; }
.level-row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.level-pill {
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 800;
  border-radius: 999px;
  border: 2px solid #F3E6D3;
  background: #fff;
  color: var(--ink-faint);
}
.level-pill.active[data-level="none"] { background: #F2EEE7; color: #8C8078; border-color: #E7DFD4; }
.level-pill.active[data-level="taste"] { background: #FFF0DE; color: #B4762A; border-color: #F7DCB6; }
.level-pill.active[data-level="half"] { background: #E9F7F0; color: var(--mint-deep); border-color: #CBEBDD; }
.level-pill.active[data-level="all"] { background: var(--mint); color: #fff; border-color: var(--mint); }

.ingredient-cloud { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.ing-chip {
  padding: 5px 10px;
  border-radius: 999px;
  background: #F4FBF7;
  border: 2px solid #D8EEE2;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--mint-deep);
}
.ing-chip.warn { background: #FFF8EC; border-color: #F8E2C4; color: #A9711B; }

/* =========================================================
   ⭐ 식판 퀵메뉴 (부모님이 등록·추가·삭제)
   ========================================================= */
.qm-wrap {
  margin-top: 12px;
  padding: 11px 12px 12px;
  border-radius: 18px;
  background: #fff;
  border: 2px dashed #F1DFC2;
}
.qm-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.qm-head strong { font-size: 13px; }
.qm-hint { font-size: 11px; color: var(--ink-faint); font-weight: 700; }
.qm-spacer { flex: 1; }
.qm-empty { margin: 8px 0 0; }
.qm-add-chip {
  border: 2px dashed #E9D9C2;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 800;
  color: #A98B5B;
  background: #FFFDF8;
  font-family: inherit;
}
.qm-add-chip.once { color: #857C72; border-color: #E2DBD1; background: #FCFAF7; }
.qm-add-chip.quick { color: #8A6414; border-color: #F2D9A4; background: #FFF9EA; }
.qm-add-chip:active { background: #FFF4DC; }
.qm-pick-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.qm-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.qm-item {
  display: inline-flex;
  align-items: stretch;
  border-radius: 999px;
  background: #FFFCF4;
  border: 2px solid #F3E3C6;
  overflow: hidden;
}
.qm-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 800;
  color: #7A5A1E;
  background: none;
  border: 0;
  font-family: inherit;
}
.qm-chip:active { background: #FFF4DC; }
.qm-emoji { font-size: 15px; line-height: 1; }
.qm-x {
  border: 0;
  border-left: 2px solid #F3E3C6;
  background: #FFF7E8;
  color: #B79A6C;
  font-size: 12px;
  font-weight: 900;
  padding: 0 9px;
  font-family: inherit;
}
.qm-x:active { background: #FFE9E2; color: #C4533C; }
.qm-slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.qm-slot {
  border: 2px solid #F3E6D3;
  border-radius: 16px;
  background: #FFFDF8;
  padding: 12px 6px;
  display: grid;
  gap: 3px;
  justify-items: center;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink-soft);
  font-family: inherit;
}
.qm-slot span { font-size: 22px; }
.qm-slot.usual { border-color: #F2C85B; background: #FFF9E8; color: #8A6414; }
.qm-slot:active { transform: scale(.97); }
.qm-pick {
  margin-top: 10px;
  padding: 11px 12px 12px;
  border-radius: 18px;
  background: #FFFDF6;
  border: 2px dashed #F1DFC2;
}
.qm-pick-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.qm-pick-head strong { font-size: 13px; }
.qm-add-inline { margin-top: 9px; }
.qm-emoji-wrap { margin: 2px 0 10px; }
.qm-emoji-wrap .rt-emoji { font-size: 17px; }

@media (min-width: 760px) {
  .qm-slot-grid { grid-template-columns: repeat(5, 1fr); }
}

.med-list { display: grid; gap: 8px; }
.med-item {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px;
  border: 2px solid #F5E7D2;
  border-radius: 16px;
  background: #FFFDF8;
}
.med-item.done { background: #F2FBF6; border-color: #CFEBDD; }
.med-info { flex: 1; min-width: 0; }
.med-name { font-weight: 800; font-size: 13.5px; }
.med-meta { font-size: 11.5px; color: var(--ink-faint); }

.growth-toggle { display: flex; gap: 5px; }
.chart-wrap { margin-top: 8px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid-line { stroke: #F3E7D7; stroke-width: 1; }
.chart .axis-text { fill: #AC9E8D; font-size: 9px; font-family: var(--font); }
.chart .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.chart .point { stroke: #fff; stroke-width: 2; }
.growth-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.growth-table th, .growth-table td { padding: 7px 4px; text-align: center; border-bottom: 1px solid #F6EDDF; }
.growth-table th { color: var(--ink-faint); font-weight: 800; font-size: 11px; }

/* =========================================================
   설정
   ========================================================= */
.settings-grid { display: grid; gap: 14px; }
.status-line {
  display: flex; align-items: center; gap: 7px;
  padding: 11px 13px; border-radius: 16px;
  background: #F3FBF7; border: 2px solid #D8EEE2;
  font-size: 12.5px; font-weight: 800; color: var(--mint-deep);
  margin-bottom: 10px;
}
.status-line.local { background: #FFF9EE; border-color: #F5E3C2; color: #A9711B; }
.key-info { display: grid; gap: 6px; margin: 0 0 10px; }
.key-info > div { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.key-info dt { color: var(--ink-faint); font-weight: 800; min-width: 86px; }
.key-info dd { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.key-info code { background: #F8EFE1; border-radius: 7px; padding: 2px 7px; font-size: 11.5px; color: #8A6414; }
.key-full { margin: 8px 0; }
.key-full label { display: block; font-size: 11.5px; font-weight: 800; color: var(--ink-faint); margin-bottom: 4px; }
.code-change { display: flex; gap: 7px; align-items: flex-end; margin-top: 10px; flex-wrap: wrap; }
.code-change .field { margin: 0; flex: 1; min-width: 150px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
details.more { margin-top: 8px; }
details.more > summary { cursor: pointer; font-size: 12.5px; font-weight: 800; color: var(--mint-deep); }

.toggle-list { display: grid; gap: 8px; }
.toggle-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px;
  border-radius: 16px;
  border: 2px solid #F5E7D2;
  background: #FFFDF8;
  text-align: left;
  width: 100%;
}
.toggle-row .tg-ico { font-size: 19px; width: 26px; text-align: center; flex: none; }
.toggle-row .tg-txt { flex: 1; min-width: 0; display: grid; }
.toggle-row .tg-txt b { font-size: 13px; }
.toggle-row .tg-txt small { font-size: 11px; color: var(--ink-faint); }
.toggle-row .tg-state {
  flex: none;
  min-width: 52px;
  text-align: center;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 11.5px; font-weight: 800;
  background: #F1EDE7; color: #9A8C7C;
}
.toggle-row.on { border-color: #CFEBDD; background: #F3FBF7; }
.toggle-row.on .tg-state { background: var(--mint); color: #fff; }

/* =========================================================
   📲 폰·패드 잠금화면 알림 (ntfy) 카드
   ========================================================= */
.ntfy-card .card-head { margin-bottom: 4px; }
.ntfy-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px;
  border-radius: 16px;
  border: 2px solid #F5E7D2;
  background: #FFFDF8;
  text-align: left;
  width: 100%;
  margin-top: 8px;
}
.ntfy-row .tg-ico { font-size: 19px; width: 26px; text-align: center; flex: none; }
.ntfy-row .tg-txt { flex: 1; min-width: 0; display: grid; }
.ntfy-row .tg-txt b { font-size: 13px; }
.ntfy-row .tg-txt small { font-size: 11px; color: var(--ink-faint); }
.ntfy-row .tg-state {
  flex: none;
  min-width: 52px;
  text-align: center;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 11.5px; font-weight: 800;
  background: #F1EDE7; color: #9A8C7C;
}
.ntfy-row.on { border-color: #CFEBDD; background: #F3FBF7; }
.ntfy-row.on .tg-state { background: var(--mint); color: #fff; }

.ntfy-topic {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 16px;
  border: 2px dashed var(--line-strong);
  background: #FFFBF6;
}
.ntfy-topic-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.ntfy-topic-head b { font-size: 12.5px; color: var(--ink); }
.ntfy-topic-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ntfy-topic-line code {
  flex: 1; min-width: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px; font-weight: 700; letter-spacing: -.2px;
  padding: 9px 11px;
  border-radius: 10px;
  background: #fff;
  border: 2px solid var(--line);
  color: var(--ink);
  overflow-wrap: anywhere;
}
.ntfy-steps {
  margin: 14px 0 0;
  padding-left: 20px;
  display: grid;
  gap: 7px;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-soft);
}
.ntfy-steps b { color: var(--ink); }

/* =========================================================
   모달 · 토스트
   ========================================================= */
.modal-wrap {
  position: fixed; inset: 0; z-index: 200;
  display: grid; place-items: center;
  padding: 18px;
  opacity: 0;
  transition: opacity .2s;
}
.modal-wrap.show { opacity: 1; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(70, 52, 32, .42); backdrop-filter: blur(4px); }
.modal {
  position: relative;
  width: 100%;
  max-width: 440px;
  max-height: 88vh;
  overflow-y: auto;
  background: linear-gradient(170deg, #FFFDF8, #FFF8EC);
  border: 3px solid #fff;
  border-radius: 30px;
  box-shadow: var(--shadow-lg);
  padding: 20px;
  transform: translateY(10px) scale(.98);
  transition: transform .24s cubic-bezier(.2, 1.2, .4, 1);
}
.modal-wrap.show .modal { transform: none; }
.modal-wide { max-width: 640px; }
.modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.modal-head h3 { font-family: var(--font-round); font-weight: 400; font-size: 20px; letter-spacing: 0; flex: 1; }
.modal-body { font-size: 13.5px; }
.modal-text { font-size: 13.5px; line-height: 1.7; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; min-width: 110px; }

.toast {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  border-radius: 18px;
  background: rgba(255, 253, 247, .97);
  border: 2px solid #F5E7D2;
  box-shadow: var(--shadow-lg);
  font-size: 13.5px;
  font-weight: 800;
  color: var(--ink);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .24s, transform .24s;
  max-width: min(92vw, 460px);
}
.toast.show { opacity: 1; transform: none; }
.toast-emoji { font-size: 18px; }
.toast-good { border-color: #CFEBDD; background: #F4FCF8; }
.toast-warn { border-color: #F8DFC2; background: #FFFAF1; }
#toastRoot {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 260;
  display: grid;
  gap: 8px;
  justify-items: center;
  pointer-events: none;
}

/* 칭찬·완료 반짝이 */
.confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 280; overflow: hidden; }
.confetti-layer i {
  position: absolute; top: -20px; display: block;
  border-radius: 3px;
  animation: confettiFall 2s linear forwards;
}
@keyframes confettiFall {
  from { transform: translateY(0) rotate(0); opacity: 1; }
  to { transform: translateY(105vh) rotate(540deg); opacity: .1; }
}

/* =========================================================
   ⏰ 그만! 알림
   ========================================================= */
.timer-quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0 10px; }
.timer-quick .btn { padding: 16px 8px; font-size: 15px; }
.timer-quick .btn b { font-size: 21px; margin-right: 2px; }
.timer-custom { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.timer-custom .field { min-width: 130px; }
.timer-custom .btn { flex: none; }

.stop-overlay {
  position: fixed; inset: 0; z-index: 300;
  display: grid; place-items: center;
  padding: 22px;
  background: radial-gradient(circle at 50% 30%, rgba(96, 62, 34, .94), rgba(52, 33, 18, .97));
  backdrop-filter: blur(6px);
  animation: soFade .28s ease-out;
}
.stop-overlay-card {
  width: 100%; max-width: 440px;
  background: linear-gradient(165deg, #FFFDF7, #FFF4E4);
  border-radius: 36px;
  padding: 30px 24px 22px;
  text-align: center;
  box-shadow: 0 26px 60px rgba(0, 0, 0, .35);
  border: 4px solid #FFE0A8;
  animation: soPop .34s cubic-bezier(.2, 1.3, .5, 1);
}
.stop-overlay .so-ico { font-size: 64px; line-height: 1; animation: soTick 1.1s ease-in-out infinite; }
.stop-overlay h2 { font-family: var(--font-round); font-weight: 400; font-size: 28px; color: #4B3C2F; margin: 10px 0 8px; letter-spacing: 0; }
.stop-overlay .so-msg { font-size: 16px; font-weight: 800; color: var(--ink-soft); line-height: 1.6; }
.stop-overlay .so-ok { width: 100%; margin-top: 20px; padding: 15px; font-size: 17px; }
.stop-overlay .so-help { margin-top: 12px; font-size: 12px; color: var(--ink-faint); }
body.timer-ringing { overflow: hidden; }
@keyframes soFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes soPop { from { transform: scale(.88); opacity: .4; } to { transform: scale(1); opacity: 1; } }
@keyframes soTick { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg) scale(1.06); } }

/* =========================================================
   💌 빵! 하고 뜨는 팝업 · 새 메시지 배너
   ========================================================= */
.bigpop-layer {
  position: fixed;
  inset: 0;
  z-index: 320;
  display: grid;
  place-items: center;
  padding: 20px;
  background: radial-gradient(circle at 50% 40%, rgba(90, 60, 90, .34), rgba(60, 42, 30, .48));
  backdrop-filter: blur(3px);
  animation: popFade .22s ease-out;
}
.bigpop {
  position: relative;
  width: 100%;
  max-width: 560px;
  padding: 34px 26px 26px;
  border-radius: 40px;
  text-align: center;
