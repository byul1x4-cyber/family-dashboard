  color: #2F8A63;
  letter-spacing: .5px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 #fff;
}
.tbar-say { font-size: 14px; font-weight: 800; color: #3E8A6D; white-space: nowrap; }
.tbar-hint {
  grid-column: 2;
  justify-self: end;
  font-size: 12px;
  font-weight: 800;
  color: #5E8A78;
  white-space: nowrap;
}
.tbar-track {
  position: relative;
  display: block;
  grid-column: 1 / -1;
  height: 22px;
  border-radius: 999px;
  background: #DDF2E7;
  box-shadow: inset 0 2px 4px rgba(110, 160, 140, .2);
  margin: 0 6px;
}
.tbar-fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, #A8EBC8, #57C795 55%, #2FAE7B);
  transition: width .3s linear, background .4s;
}
.tbar-fill.soon { background: linear-gradient(90deg, #FFE07A, #FFB05E); }
.tbar-fill.over { background: linear-gradient(90deg, #FFD3C6, #FF8F7C); }
.tbar-runner {
  position: absolute;
  top: 50%;
  left: 0;
  line-height: 0;
  transform: translate(-50%, -50%);
  transition: left .3s linear;
  animation: tbarHop .58s ease-in-out infinite;
  filter: drop-shadow(0 2px 3px rgba(110, 150, 130, .35));
  font-weight: 400;
}
.tbar-runner img { width: 30px; height: 30px; display: block; }
.tbar-flag { position: absolute; right: -3px; top: 50%; transform: translateY(-50%); font-size: 16px; line-height: 1; }
.tidy-bar.over .tbar-left { color: #B3402A; }
@keyframes tbarHop {
  0%, 100% { transform: translate(-50%, -62%); }
  50% { transform: translate(-50%, -38%); }
}

/* ---- 할 일 탭 안의 정리시간 화면 ---- */
.tidy-view { animation: scFade .22s ease-out; }
.tv-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 7px 13px;
  margin-bottom: 8px;
  border-radius: 22px;
  border: 3px solid #fff;
  background: linear-gradient(160deg, #F2FCF7, #E6FAF1);
  box-shadow: 0 6px 18px rgba(120, 180, 150, .16);
}
.tv-h1 { display: flex; align-items: center; gap: 9px; min-width: 0; }
.tv-ico { font-size: 27px; line-height: 1; }
.tv-h1t { display: flex; flex-direction: column; min-width: 0; }
.tv-h1t b { font-family: var(--font-round); font-weight: 400; font-size: 21px; color: #1F6B4F; letter-spacing: 0; }
.tv-h1t small { font-size: 11.5px; font-weight: 700; color: #4F8A73; }
.tv-who { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

/* 남은 시간 + 게이지 */
.tv-timer {
  padding: 10px 18px 14px;
  border-radius: 28px;
  border: 3px solid #fff;
  background: #fff;
  box-shadow: 0 10px 26px rgba(120, 170, 150, .16);
  margin-bottom: 10px;
}
.tv-left { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
.tv-left b {
  font-family: var(--font-round);
  font-weight: 400;
  font-size: 58px;
  line-height: 1.02;
  color: #2F6B52;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 #fff;
}
.tv-left span { font-size: 19px; font-weight: 800; color: #5C8A76; }
.tv-track {
  position: relative;
  height: 26px;
  margin: 12px 6px 2px;
  border-radius: 999px;
  background: #E4F2EA;
  box-shadow: inset 0 2px 5px rgba(110, 160, 140, .18);
}
.tv-fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, #B7F0D4, #57C795 55%, #2FAE7B);
  transition: width .3s linear, background .4s;
}
.tv-fill.soon { background: linear-gradient(90deg, #FFE07A, #FFB05E); }
.tv-fill.over { background: linear-gradient(90deg, #FFD3C6, #FF8F7C); }
.tv-runner {
  position: absolute;
  top: 50%;
  left: 0;
  line-height: 0;
  transform: translate(-50%, -50%);
  transition: left .3s linear;
  animation: tvHop .56s ease-in-out infinite;
}
.tv-runner img { width: 46px; height: 46px; display: block; filter: drop-shadow(0 3px 4px rgba(110, 150, 130, .32)); }
.tv-goal { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); font-size: 24px; line-height: 1; }
@keyframes tvHop {
  0%, 100% { transform: translate(-50%, -62%); }
  50% { transform: translate(-50%, -34%); }
}

/* 가운데 큰 포켓몬 카드 */
.tv-stage {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 4px;
  min-height: 258px;
  padding: 14px 18px 16px;
  border-radius: 36px;
  border: 4px solid #fff;
  background:
    radial-gradient(520px 240px at 50% 18%, #FFFFFF 0%, rgba(255, 255, 255, 0) 72%),
    linear-gradient(170deg, #EAFBF2, #EAF4FF 68%, #FFF1F6);
  box-shadow: 0 16px 38px rgba(120, 170, 150, .2);
  overflow: hidden;
}
.tv-bubble {
  position: relative;
  z-index: 2;
  max-width: 94%;
  padding: 9px 20px;
  border-radius: 20px;
  border: 3px solid #CFF0E0;
  background: #fff;
  color: #1F6B4F;
  font-family: var(--font-round);
  font-weight: 400;
  font-size: 23px;
  line-height: 1.25;
  text-align: center;
  word-break: keep-all;
  box-shadow: 0 8px 18px rgba(120, 180, 150, .16);
}
.tv-bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -13px;
  transform: translateX(-50%);
  border: 9px solid transparent;
  border-top-color: #CFF0E0;
}
.tv-bubble.pop { animation: tvPop .44s ease-out; }
@keyframes tvPop {
  0% { transform: scale(.9); }
  55% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
.tv-mon { position: relative; z-index: 1; display: grid; place-items: center; margin-top: 2px; }
.tv-mon img {
  width: 216px;
  height: 216px;
  object-fit: contain;
  animation: tvBounce 1.6s ease-in-out infinite;
  filter: drop-shadow(0 14px 16px rgba(90, 120, 100, .22));
}
.tv-floor {
  width: 190px;
  height: 16px;
  margin-top: -10px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(90, 130, 110, .26), rgba(90, 130, 110, 0));
}
.tv-say { font-size: 12.5px; font-weight: 800; color: #4F8A73; }
@keyframes tvBounce {
  0%, 100% { transform: translateY(0) rotate(-2.5deg); }
  50% { transform: translateY(-14px) rotate(2.5deg); }
}

/* 하단 버튼 */
.tv-actions { margin-top: 10px; }
.tv-finish {
  width: 100%;
  min-height: 68px;
  font-size: 25px;
  border-radius: 24px;
}
.tv-minis { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.tv-mini {
  flex: 1 1 0;
  min-width: 104px;
  min-height: 48px;
  padding: 8px 10px;
  border-radius: 16px;
  border: 2px solid #D5EDE2;
  background: #fff;
  color: #2F6B52;
  font-size: 14px;
  font-weight: 800;
}
.tv-mini:active { transform: scale(.98); }
.tv-mini.ghost { color: #8C8378; border-color: #E8E0D5; background: #FFFDFA; }
.tv-note { margin-top: 8px; text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-faint); }

/* 일시정지·시간 끝 표시 */
.tidy-view.paused .tv-stage { filter: grayscale(.4) brightness(.99); }
.tidy-view.paused .tv-mon img,
.tidy-view.paused .tv-runner { animation-play-state: paused; }
.tidy-view.over .tv-stage { box-shadow: 0 0 0 4px #FFE9A8, 0 16px 38px rgba(200, 170, 90, .22); }
.tidy-view.over .tv-left b { color: #B3402A; }

@media (max-width: 900px) {
  .tv-left b { font-size: 50px; }
  .tv-mon img { width: 190px; height: 190px; }
  .tv-bubble { font-size: 20px; }
  .tv-stage { min-height: 224px; }
}
@media (max-width: 619px) {
  .tbar-btn { padding: 9px 11px 11px; border-radius: 18px; }
  .tbar-left { font-size: 30px; }
  .tbar-say { font-size: 12px; }
  .tbar-hint { font-size: 11px; }
  .tbar-track { height: 18px; }
  .tbar-runner img { width: 24px; height: 24px; }
  .tbar-flag { font-size: 13px; right: -1px; }
  .tv-head { padding: 8px 10px; }
  .tv-h1t b { font-size: 19px; }
  .tv-who { width: 100%; margin-left: 0; }
  .tv-timer { padding: 8px 12px 12px; border-radius: 24px; }
  .tv-left b { font-size: 40px; }
  .tv-left span { font-size: 15px; }
  .tv-track { height: 22px; margin-top: 10px; }
  .tv-runner img { width: 36px; height: 36px; }
  .tv-goal { font-size: 18px; }
  .tv-stage { min-height: 186px; padding: 10px 12px 12px; border-radius: 28px; }
  .tv-bubble { font-size: 17px; padding: 7px 12px; border-width: 2px; }
  .tv-bubble::after { border-width: 7px; bottom: -10px; }
  .tv-mon img { width: 148px; height: 148px; }
  .tv-floor { width: 140px; height: 13px; margin-top: -8px; }
  .tv-say { font-size: 11.5px; }
  .tv-finish { min-height: 62px; font-size: 22px; border-radius: 20px; }
  .tv-mini { flex: 1 1 30%; min-width: 0; font-size: 12.5px; padding: 8px 4px; }
  .tv-note { font-size: 11px; }
}

/* ---------------- ✍️ 손글씨 편지 ---------------- */
.mail-ornament {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0 0;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-faint);
}
.mail-ornament::before,
.mail-ornament::after {
  content: "";
  flex: 1;
  height: 2px;
  border-radius: 2px;
  background: #F4E6D1;
}
.hw-block {
  margin-top: 12px;

}

.hw-head span { font-size: 11.5px; color: var(--ink-faint); font-weight: 700; }
.hw-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.hw-colors { display: flex; gap: 5px; }
.hw-swatch {
  width: 26px; height: 26px;

}

.hw-size, .hw-eraser, .hw-clear {
  padding: 5px 10px;

.hw-stage {

}

}

.chat-hw {

/* ---------------- ⚡ 포켓몬 (알 → 3단계 진화) ---------------- */
.pk-rules { margin-bottom: 12px; }
.pk-rules-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.pk-rules-head b { font-family: var(--font-round); font-weight: 400; font-size: 20px; color: #8A5A10; letter-spacing: 0; }
.pk-rules-head span { margin-left: auto; font-size: 12px; font-weight: 800; color: #A0763A; }
.pk-rules p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.65; }

.pk-card {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pk-card::after {
  content: "";
  position: absolute;
  top: -70px; right: -60px;
  width: 210px; height: 210px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 226, 160, .55), rgba(255, 226, 160, 0) 68%);
  pointer-events: none;
}
.pk-hero {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
  padding: 10px;
  border-radius: 24px;
  background: linear-gradient(150deg, #FFFDF6, #FFF4DE 62%, #FFF0F7);
  border: 2px solid #FFEBC6;
  overflow: hidden;
}
.pk-aura {
  position: absolute;
  left: -34px;
  top: 50%;
  width: 190px; height: 190px;
  transform: translateY(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 218, 140, .7), rgba(255, 218, 140, 0) 66%);

  pointer-events: none;
}
@keyframes pkAura {
  0%, 100% { transform: translateY(-50%) scale(1); opacity: .7; }
  50% { transform: translateY(-50%) scale(1.18); opacity: 1; }
}
.pk-art {
  position: relative;
  width: 130px; height: 130px;
  flex: none;
  display: grid;
  place-items: center;
  z-index: 1;
}
.pk-mon {
  width: 122px; height: 122px;
  object-fit: contain;
  animation: pkFloat 3.2s ease-in-out infinite;
  filter: drop-shadow(0 10px 14px rgba(160, 110, 40, .3));
}
@keyframes pkFloat {
  0%, 100% { transform: translateY(-3px) rotate(-1deg); }
  50% { transform: translateY(6px) rotate(1deg); }
}
.pk-egg-art { position: relative; display: grid; place-items: center; }
.pk-egg-emoji {
  font-size: 76px;
  line-height: 1;
  display: block;
  animation: pkWobble 2.2s ease-in-out infinite;
  filter: drop-shadow(0 8px 10px rgba(170, 130, 60, .3));
}
@keyframes pkWobble {
  0%, 100% { transform: rotate(-8deg) translateY(0); }
  25% { transform: rotate(7deg) translateY(-2px); }
  50% { transform: rotate(-4deg) translateY(1px); }
  75% { transform: rotate(9deg) translateY(-1px); }
}
.pk-egg-shine {
  position: absolute;
  right: 2px; top: 4px;
  font-size: 20px;
  animation: pkTwinkle 1.9s ease-in-out infinite;
}
@keyframes pkTwinkle {
  0%, 100% { opacity: .2; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.15); }
}
.pk-hero-info { flex: 1; min-width: 0; z-index: 1; }
.pk-name {
  font-family: var(--font-round);
  font-weight: 400;
  font-size: 22px;
  color: #4B3A2B;
  letter-spacing: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pk-lv {
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 999px;
  background: linear-gradient(150deg, #FFD479, #F8B93E);
  color: #6B4A08;
  box-shadow: 0 3px 8px rgba(248, 188, 69, .35);
}
.pk-sub { font-size: 11.5px; font-weight: 800; color: var(--ink-faint); margin-top: 2px; }
.pk-bar {
  height: 15px;
  margin-top: 8px;
  border-radius: 999px;
  background: #F5E7D2;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(160, 130, 90, .16);
}
.pk-bar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #FFE07A, #FFB23A 60%, #FF8FB4);
  box-shadow: 0 0 10px rgba(255, 178, 58, .7);
  transition: width .45s ease;
  position: relative;
}
.pk-bar > i::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.65), rgba(255,255,255,0));
  transform: translateX(-100%);

}
@keyframes pkShineBar { to { transform: translateX(100%); } }
.pk-progtxt { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; font-weight: 800; color: var(--ink-faint); margin-top: 5px; white-space: nowrap; }

/* 단계 트랙 */
.pk-track {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  margin-top: 10px;
  padding: 7px 4px;
  border-radius: 16px;
  background: #FFFBF2;
  border: 2px dashed #F7E4C4;
}
.pk-tr {
  flex: 1;

  flex-direction: column;
  align-items: center;

.pk-tr i { font-size: 26px; font-style: normal; line-height: 1.15; }

.pk-egg img { width: 54px; height: 54px; image-rendering: pixelated; object-fit: contain; }
.pk-egg b { font-size: 12px; font-weight: 800; color: var(--ink); }
.pk-egg small { font-size: 9.5px; color: var(--ink-faint); font-weight: 700; }

/* 🥚 신비한 알 — 알 단계에서는 정체를 보여 주지 않습니다 */
.pk-mystery { display: flex; justify-content: center; padding: 4px 0 2px; }
.pk-mystery-egg {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 100%;
  max-width: 340px;
  padding: 16px 12px 14px;
  border-radius: 24px;
  border: 3px dashed #F0D7AE;
  background: radial-gradient(circle at 50% 30%, #FFFDF6, #FFF2DC 72%);
  transition: transform .14s, border-color .16s, box-shadow .2s;
}
.pk-mystery-egg:hover { border-color: #FFCB6B; transform: translateY(-3px); box-shadow: 0 10px 22px rgba(210, 165, 90, .22); }
.pk-mystery-egg:active { transform: scale(.98); }
.pk-mystery-emoji { font-size: 64px; line-height: 1.1; animation: pkEggWobble 2.8s ease-in-out infinite; }
.pk-mystery-egg b { font-family: var(--font-round); font-weight: 400; font-size: 18px; color: #8A5A10; letter-spacing: 0; }
.pk-mystery-egg small { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); line-height: 1.55; text-align: center; }
@keyframes pkEggWobble {
  0%, 70%, 100% { transform: rotate(0deg); }
  76% { transform: rotate(-7deg); }
  83% { transform: rotate(6deg); }
  90% { transform: rotate(-3deg); }
}
.pk-tr.locked i { font-size: 20px; opacity: .6; }
.pk-tr.locked em { color: #C9B9A6; letter-spacing: .5px; }
/* 도달 전 단계는 까만 실루엣만 보여 줍니다 */
.pk-track .pk-tr.locked { opacity: 1; }
.pk-track .pk-tr.locked img { filter: brightness(0); opacity: .88; }

/* 반짝이 · 플래시 */
/* 별 폭죽 캔버스 — 화면 위에 별이 쏟아지는 레이어 (클릭은 통과) */
.pk-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 250; }
.pk-sparks { position: fixed; inset: 0; pointer-events: none; z-index: 400; }
.pk-sparks span {
  position: fixed;
  animation-name: pkSparkUp;
  animation-timing-function: ease-out;
  animation-fill-mode: forwards;
}
@keyframes pkSparkUp {
  0% { opacity: 0; transform: translateY(0) scale(.5) rotate(0deg); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-70px) scale(1.25) rotate(35deg); }
}
.pk-flash {
  position: fixed;
  inset: 0;
  z-index: 395;
  pointer-events: none;
  background: radial-gradient(circle at 50% 45%, #FFFFFF, rgba(255, 246, 214, .75) 45%, rgba(255, 255, 255, 0) 78%);
  animation: pkFlash .85s ease-out forwards;
}
@keyframes pkFlash {
  0% { opacity: 0; }
  18% { opacity: .95; }
  100% { opacity: 0; }
}

/* 진화 축하 모달 */
.pk-evo-modal { text-align: center; }
.pk-evo-lead { font-size: 13px; font-weight: 800; color: var(--ink-soft); }
.pk-evo-stage {
  position: relative;
  margin: 8px auto 2px;
  width: 200px; height: 200px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 228, 150, .85), rgba(255, 240, 200, 0) 68%);
  animation: pkEvoPulse 2.2s ease-in-out infinite;
}
@keyframes pkEvoPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.pk-evo-big {
  width: 180px; height: 180px;
  object-fit: contain;
  animation: pkEvoIn .9s cubic-bezier(.16, 1.4, .4, 1) both, pkFloat 3s ease-in-out 1s infinite;
  filter: drop-shadow(0 12px 18px rgba(160, 110, 40, .3));
}
@keyframes pkEvoIn {
  0% { transform: scale(.2) rotate(-18deg); opacity: 0; }
  60% { transform: scale(1.12) rotate(6deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}
.pk-evo-name { font-family: var(--font-round); font-size: 24px; color: #B4467A; letter-spacing: 0; margin-top: 2px; }
.pk-evo-chain { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 8px 0 4px; }
.pk-evo-step { display: flex; flex-direction: column; align-items: center; }
.pk-evo-step img { width: 52px; height: 52px; object-fit: contain; }
.pk-evo-step b { font-size: 10.5px; font-weight: 800; color: var(--ink-soft); }
.pk-evo-step.egg i { font-size: 38px; font-style: normal; line-height: 1.25; }
.pk-evo-step.now b { color: #B4467A; }
.pk-evo-step.now img { filter: drop-shadow(0 5px 9px rgba(200, 120, 60, .4)); animation: pkEvoIn .7s cubic-bezier(.16, 1.4, .4, 1) both; }
.pk-evo-arrow { color: #C9B9A6; font-weight: 800; }
.pk-evo-final {
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: 14px;
  background: #FFF4D6;
  color: #8A6412;
  font-size: 12px;
  font-weight: 800;
}

.pk-rules-btns { margin-top: 10px; }

/* 도감 — 반짝이는 홀로그램 카드 */
.pk-pick { margin-bottom: 12px; }
.pk-pick .chip small { font-size: 10px; font-weight: 800; opacity: .9; }
/* 알·키우기 카드 묶음 — 좁은 화면은 고른 아이 하나만 */
.pk-duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: stretch; }
.pk-duo-col { min-width: 0; display: none; }
.pk-duo-col.active { display: block; }
.pk-duo-col > .pk-card { height: 100%; }
.pk-dex { margin-top: 12px; }
.pk-dex-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; }
.pk-dex-ico { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; background: var(--sun-soft); font-size: 17px; flex: none; }
.pk-dex-title b { display: block; font-family: var(--font-round); font-weight: 400; font-size: 17px; color: #4B3A2B; letter-spacing: 0; }
.pk-dex-title small { font-size: 11.5px; font-weight: 800; color: var(--ink-faint); }
/* 두 아이 도감 — 탭 없이 늘 함께 (좁은 화면은 위아래로, 넓은 화면은 나란히) */
.pk-dex-duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.pk-dex-pane { min-width: 0; }
.pk-dex-sub { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; padding: 0 2px; }
.pk-dex-sub-name { font-size: 13.5px; font-weight: 800; color: var(--ink-soft); }
.pk-dex-sub-name b { color: #4B3A2B; }
.pk-dex-sub-count { margin-left: auto; font-size: 11.5px; font-weight: 800; color: var(--ink-faint); }
.pk-dex-help { font-size: 11px; color: var(--ink-faint); margin-top: 8px; line-height: 1.45; }
.pk-dex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 7px;
}
.pk-dex-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 3px 6px;
  border-radius: 16px;
  background: #F7F2EA;
  border: 2px solid #F2E7D7;
  overflow: hidden;
}
.pk-dex-cell img { width: 46px; height: 46px; object-fit: contain; image-rendering: pixelated; }
/* 아직 못 모은 포켓몬은 완전 까만 실루엣만 (정체를 모르게) */
.pk-dex-cell:not(.owned) img { filter: brightness(0); opacity: .82; }
.pk-dex-cell span { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); }
.pk-dex-cell.owned {
  background: linear-gradient(150deg, #FFF8DE, #FFE9F3 45%, #E6F7FF 90%);
  border-color: #FFE3A3;
  box-shadow: 0 4px 12px rgba(255, 200, 120, .3);
}
.pk-dex-cell.owned img { filter: none; animation: pkFloat 4s ease-in-out infinite; }
.pk-dex-cell.owned span { color: #6B4A08; }
.pk-dex-cell.owned::after {
  content: "";
  position: absolute;
  inset: -40%;
  background: linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 65%);
  transform: translateX(-120%);
  animation: pkHolo 3.4s linear infinite;
  pointer-events: none;
}
@keyframes pkHolo { to { transform: translateX(120%); } }

/* ---------------- 🎛️ 부모님 모드 · 새 기능 관리 ---------------- */
.admin-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 9px;
  margin-top: 10px;
}
.admin-btn {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 12px;
  border-radius: 18px;
  border: 2px solid #F1E4D2;
  background: linear-gradient(165deg, #FFFDF8, #FFF7EC);
  text-align: left;
  transition: transform .12s, background .16s, border-color .16s;
}
.admin-btn:hover { background: #fff; border-color: #FFE0A6; transform: translateY(-2px); }
.admin-btn:active { transform: scale(.98); }
.admin-btn span { font-size: 22px; line-height: 1; }
.admin-btn b { font-size: 13.5px; color: var(--ink); }
.admin-btn small { font-size: 11px; color: var(--ink-faint); font-weight: 700; }

.ed-block {
  margin-top: 14px;
  padding: 12px;
  border-radius: 18px;
  border: 2px solid #F4E6D1;
  background: #FFFDF8;
}
.ed-block-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.ed-block-head b { font-size: 14px; }
.ed-block-head span { margin-left: auto; font-size: 11.5px; font-weight: 800; color: var(--ink-faint); }
.ed-list { display: grid; gap: 6px; margin-bottom: 8px; }
.ed-row { display: flex; align-items: center; gap: 5px; }
.ed-emoji {
  width: 48px;
  flex: none;
  text-align: center;
  font-size: 18px;
  padding: 8px 2px;
}
.ed-label { flex: 1; min-width: 0; padding: 9px 10px; font-size: 13px; }
.ed-btn {
  width: 32px; height: 34px;
  flex: none;
  border-radius: 10px;
  border: 2px solid #F1E4D2;
  background: #fff;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink-soft);
}
.ed-btn:hover { background: #FFF7EC; }
.ed-btn.del { color: #C4533C; border-color: #FFD8CE; background: #FFF6F3; }

.sw-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  background: #FFFBF3;
  border: 2px solid #F4E6D1;
  cursor: pointer;
}
.sw-row input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw-box {
  width: 42px; height: 24px;
  flex: none;
  border-radius: 999px;
  background: #E8DCC8;
  position: relative;
  transition: background .18s;
}
.sw-box::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(150, 120, 80, .3);
  transition: transform .18s;
}
.sw-row input:checked + .sw-box { background: #57C795; }
.sw-row input:checked + .sw-box::after { transform: translateX(18px); }
.sw-txt { font-size: 13px; font-weight: 800; color: var(--ink); }

.pk-set-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------------- 패드·데스크톱: 두 아이 2분할 + 아래 도감을 한 화면에 ---------------- */
@media (min-width: 761px) {
  /* 카드도 도감도 두 아이가 다 보이니 아이 고르기 칩은 숨겨요 */
  .pk-pick { display: none; }
  .pk-duo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .pk-duo-col { display: block; }

  /* 위쪽 설명 카드는 한 줄 띠로 */
  .pk-rules { padding: 9px 13px; margin-bottom: 9px; border-radius: 22px; }
  .pk-rules p { display: none; }
  .pk-rules-head { margin-bottom: 0; }
  .pk-rules-head b { font-size: 16px; }
  .pk-rules-btns { margin-top: 7px; }

  /* 키우기 카드 — 위아래를 줄여 두 장이 한 화면에 들어오게 */
  .pk-duo .pk-card { padding: 10px 11px; border-radius: 22px; }
  .pk-duo .rk-head { gap: 6px; }
  .pk-duo .rk-head strong { font-size: 16px; }
  .pk-duo .rk-head .avatar { width: 30px; height: 30px; font-size: 16px; }
  .pk-duo .pk-hero { gap: 7px; margin-top: 4px; padding: 5px 8px; border-radius: 16px; }
  .pk-duo .pk-art { width: 76px; height: 76px; }
  .pk-duo .pk-mon { width: 72px; height: 72px; }
  .pk-duo .pk-egg-emoji { font-size: 48px; }
  .pk-duo .pk-name { font-size: 17px; gap: 6px; }
  .pk-duo .pk-lv { font-size: 10px; padding: 2px 6px; }
  .pk-duo .pk-sub { font-size: 10px; margin-top: 1px; }
  .pk-duo .pk-bar { height: 10px; margin-top: 5px; }
  .pk-duo .pk-progtxt { font-size: 10px; margin-top: 3px; }
  .pk-duo .pk-track { margin-top: 7px; padding: 4px 3px; border-radius: 13px; }
  .pk-duo .pk-tr img { width: 28px; height: 28px; }
  .pk-duo .pk-tr i { font-size: 17px; }
  .pk-duo .pk-tr em { font-size: 8.5px; }
  .pk-duo .pk-next { margin-top: 6px; padding: 4px 7px; gap: 5px; }
  .pk-duo .pk-next-img { width: 24px; height: 24px; }
  .pk-duo .pk-next-mystery { width: 22px; height: 22px; font-size: 12px; }
  .pk-duo .pk-next b { font-size: 11.5px; }
  .pk-duo .pk-next small { font-size: 9.5px; }
  .pk-duo .pk-feed { margin-top: 7px; gap: 5px; flex-wrap: nowrap; }
  .pk-duo .pk-feed .btn { min-width: 0; padding: 5px 3px; font-size: 11px; }
  .pk-duo .pk-help { margin-top: 5px; font-size: 10px; line-height: 1.35; }
  .pk-duo .pk-new { margin-top: 7px; }
  .pk-duo .pk-choose-help { margin: 4px 0 6px; font-size: 11px; }
  .pk-duo .pk-mystery { padding: 0; }
  .pk-duo .pk-mystery-egg { padding: 8px; }
  .pk-duo .pk-mystery-emoji { font-size: 44px; }
  .pk-duo .pk-mystery-egg b { font-size: 15px; }

  /* 아래 도감 — 민국·이준 도감을 나란히 두고, 각 20종이 두 줄로 딱 떨어지게 */
  .pk-dex { margin-top: 7px; padding: 8px 12px 7px; border-radius: 22px; }
  /* 넓은 화면에서는 아이별 머리글이 있으니 도감 전체 머리줄은 접어 두 줄 더 확보 */
  .pk-dex-head { display: none; }
  .pk-dex-ico { width: 28px; height: 28px; font-size: 14px; border-radius: 10px; }
  .pk-dex-title { display: flex; align-items: baseline; gap: 7px; }
  .pk-dex-title b { font-size: 15.5px; }
  .pk-dex-title small { font-size: 11px; }
  .pk-dex-duo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .pk-dex-sub { margin-bottom: 5px; }
  .pk-dex-sub-name { font-size: 12.5px; }
  .pk-dex-sub-count { font-size: 10.5px; }

  .pk-dex-cell { padding: 3px 1px 2px; border-radius: 10px; gap: 0; }
  .pk-dex-cell img { width: 28px; height: 28px; }
  .pk-dex-cell span { font-size: 9px; letter-spacing: -.2px; white-space: nowrap; }
  .pk-dex-help { margin-top: 5px; font-size: 10px; }
}

/* =========================================================
   🌅 등교 시작 (2026-11-19 개편)
   · 팝업 없이 '할 일' 탭 안의 화면 + 모든 탭 위 남은 시간 바
   · 위 줄 민국 5장 / 아래 줄 이준 5장 = 10분할 큰 그림 카드
   ========================================================= */

/* ---- 모든 탭 위 남은 시간 바 ---- */
.school-bar { margin: 0 0 8px; }
.school-bar[hidden] { display: none; }
.sb-btn {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 5px 12px;
  padding: 8px 14px 10px;
  border-radius: 22px;
  border: 3px solid #fff;
  background: linear-gradient(160deg, #FFFDF2, #FFF4DC 62%, #FFEFF3);
  box-shadow: 0 8px 22px rgba(200, 160, 110, .2);
  text-align: left;
  transition: transform .12s, box-shadow .18s;
}
.sb-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(200, 160, 110, .26); }
.sb-btn:active { transform: scale(.995); }
.sb-top { display: flex; align-items: center; gap: 8px; min-width: 0; grid-column: 1; }
.sb-ico { font-size: 22px; line-height: 1; flex: none; }
.sb-time { display: inline-flex; align-items: baseline; gap: 12px; min-width: 0; }
.sb-left {
  font-family: var(--font-round);
  font-size: 34px;
  line-height: 1;
  color: #C9603F;
  letter-spacing: .5px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 #fff;
}
.sb-say { font-size: 14px; font-weight: 800; color: #B3724C; white-space: nowrap; }
.sb-kids {
  grid-column: 2;
  justify-self: end;
  font-size: 12px;
  font-weight: 800;
  color: #8A7A66;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sb-track {
  position: relative;
  display: block;
  grid-column: 1 / -1;
  height: 22px;
  border-radius: 999px;
  background: #F3E5CC;
  box-shadow: inset 0 2px 4px rgba(160, 130, 90, .18);
  margin: 0 6px;
}
.sb-fill {
  display: block;
  height: 100%;
  width: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #FFE07A, #9BE3BF 45%, #57C795);
  transition: width .9s linear, background .4s;
}
.sb-fill.soon { background: linear-gradient(90deg, #FFD27A, #FFA95E); }
.sb-fill.over { background: linear-gradient(90deg, #FFC2B6, #FF8F7C); }
.sb-runner {
  position: absolute;
  top: 50%;
  left: 96%;
  font-size: 22px;
  line-height: 1;
  transform: translate(-50%, -50%);
  transition: left .9s linear;
  filter: drop-shadow(0 2px 3px rgba(150, 110, 70, .28));
  font-weight: 400;
}
.school-bar.over .sb-left { color: #B3402A; }

/* ---- 할 일 탭 안의 등교 화면 ---- */
.school-view { animation: scFade .22s ease-out; }
.sv-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 6px 12px;
  margin-bottom: 7px;
  border-radius: 22px;
  border: 3px solid #fff;
  background: linear-gradient(160deg, #FFFDF4, #FFF3DC);
  box-shadow: 0 6px 18px rgba(200, 165, 110, .16);
}
.sv-h1 { display: flex; align-items: center; gap: 9px; min-width: 0; }
.sv-ico { font-size: 26px; line-height: 1; }
.sv-h1t { display: flex; flex-direction: column; min-width: 0; }
.sv-h1t b { font-family: var(--font-round); font-weight: 400; font-size: 20px; color: #6B4A08; letter-spacing: 0; }
.sv-h1t small { font-size: 11.5px; font-weight: 700; color: #A0763A; }
.sv-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.sv-all {
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 16px;
  background: linear-gradient(160deg, #FFF1C9, #FFE6F0);
  text-align: center;
  font-weight: 800;
  color: #8A5A10;
}
.sv-foot { margin-top: 2px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sv-note { flex: 1; min-width: 200px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }

/* ---- 아이 한 줄 (민국 / 이준) ---- */
.sc-row {
  margin-bottom: 6px;
  padding: 5px 10px 5px;
  border-radius: 26px;
  border: 3px solid #fff;
  background: linear-gradient(165deg, #F2FCF7, #FFFFFF 68%);
  box-shadow: 0 8px 20px rgba(140, 180, 160, .14);
}
.sc-row.coral { background: linear-gradient(165deg, #FFF5F1, #FFFFFF 68%); }
.sc-row.all { border-color: #FFE9A8; background: linear-gradient(165deg, #FFFBEA, #FFFFFF 68%); }
.sc-rowhead { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.sc-rowhead .avatar.sm { width: 22px; height: 22px; }
.sc-rowhead b { font-size: 15px; }
.sc-row-badge { font-size: 11.5px; font-weight: 800; color: #8A6412; background: #FFF1C9; border-radius: 999px; padding: 3px 8px; }
.sc-rowpct { margin-left: auto; font-size: 12.5px; font-weight: 800; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.sc-rowbar { flex: 0 1 240px; height: 9px; border-radius: 999px; background: #EFE6D8; overflow: hidden; }
.sc-rowbar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #9BE3BF, #57C795); transition: width .35s; }

/* ---- 10분할 큰 그림 카드 ---- */
.sc-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.scard {
  position: relative;
  display: grid;
  grid-template-rows: auto auto auto;
  gap: 0;
  padding: 5px 8px 6px;
  border-radius: 22px;
  border: 3px solid #fff;
  background: linear-gradient(#FFFFFF, #FFFCF4);
  box-shadow: 0 7px 16px rgba(150, 120, 80, .12);
  text-align: center;
  overflow: hidden;
  transition: transform .12s, box-shadow .18s, border-color .18s, background .18s;
}
.scard:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(150, 120, 80, .18); }
.scard:active { transform: scale(.975); }
.scard-art { display: block; }
.scard-svg { display: block; width: 100%; height: auto; border-radius: 16px; }
.scard-num {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 2;
  width: 25px; height: 25px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #FFD98A;
  color: #B4741E;
  font-size: 12.5px;
  font-weight: 900;
  box-shadow: 0 3px 8px rgba(180, 140, 80, .2);
}
.scard-body { display: grid; justify-items: center; gap: 2px; padding: 4px 2px 0; }
.scard-title { font-size: 13px; font-weight: 800; color: var(--ink); line-height: 1.18; word-break: keep-all; }
.scard-cta {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  background: #FFF3D6;
  color: #A87A20;
  font-size: 11.5px;
  font-weight: 800;
  white-space: nowrap;
}
.scard-check {
  position: absolute;
  top: 12px; right: 12px;
  z-index: 2;
  width: 26px; height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #57C795;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  box-shadow: 0 3px 8px rgba(60, 150, 110, .3);
}
.scard.done { background: linear-gradient(160deg, #EAFBF2, #F8FFFB); border-color: #B7E7CE; }
.scard.done .scard-title { color: #2C8563; }
.scard.done .scard-cta { background: #D6F5E5; color: #2C8563; }
.scard.done .scard-svg { opacity: .92; }
.scard.locked { background: #FAF7F2; border-color: #E5DED4; border-style: dashed; }
.scard.locked .scard-svg { filter: grayscale(.55); opacity: .7; }
.scard.locked .scard-cta { background: #EEE9E1; color: #8C8378; }

.tab.locked { position: relative; }
.tab.locked::after {
  content: "🔒";
  position: absolute;
  top: -6px;
  right: -4px;
  font-size: 12px;
  line-height: 1;
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .18));
}

@media (max-width: 900px) {
  .sc-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sc-rowbar { display: none; }
  .sb-left { font-size: 28px; }
}
@media (max-width: 619px) {
  .sc-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .scard { flex: 0 0 calc(50% - 4px); }
  .scard-title { font-size: 13px; }
  .sb-btn { padding: 9px 11px 11px; border-radius: 18px; gap: 8px 8px; }
  .sb-top { flex-wrap: nowrap; }
  .sb-kids { font-size: 10.5px; color: #6E5F4C; }
  .sb-runner { display: none; }
  .sb-left { font-size: 30px; }
  .sb-say { font-size: 12px; }
  .sb-kids { font-size: 11px; }
  .sb-track { height: 18px; }
  .sb-runner { font-size: 24px; top: -12px; }
  .sv-head { padding: 8px 10px; }
  .sv-h1t b { font-size: 19px; }
  .sv-actions .btn { font-size: 12px; padding: 7px 10px; }
}

/* ⭐ 별 없는 체크(알림장 체크) 표시 */
.r-nostar {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 999px;
  background: #EFEAF7;
  color: #7C6BA8;
  font-size: 10.5px;
  font-weight: 800;
  vertical-align: 1px;
}

/* =========================================================
   ✏️🧹 상단 시계 옆 바로가기 · 📅 홈 오늘·내일 카드 (2026-11-19)
   ========================================================= */

/* ---- 상단 바로가기 (편지 · 정리) ---- */
.quick-bar { display: flex; align-items: center; gap: 6px; flex: none; }
.qb-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 2px solid #FFF0DA;
  background: linear-gradient(160deg, #FFFDF6, #FFF3E2);
  color: #7A5B33;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  box-shadow: 0 4px 10px rgba(220, 180, 120, .16);
  transition: transform .14s, box-shadow .18s, background .18s;
}
.qb-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(220, 180, 120, .22); }
.qb-btn:active { transform: scale(.97); }
.qb-btn .qb-ico { font-size: 15px; line-height: 1; }
.qb-btn.tidy {
  background: linear-gradient(160deg, #F5FDF9, #E7FAF1);
  border-color: #D7F0E4;
  color: #2F6B52;
  box-shadow: 0 4px 10px rgba(120, 180, 150, .18);
}

/* ---- 홈: 오늘·내일 일정 + 미니 달력 ---- */
.day-card { margin-bottom: 12px; }
.day-cols {
  display: grid;
  grid-template-columns: minmax(0, 318px) minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.day-cal .mini-cal { margin-bottom: 0; }
.day-list { display: grid; gap: 8px; align-content: start; }
.day-block {
  padding: 8px 10px 10px;
  border-radius: 16px;
  border: 2px solid #FFF1DA;
  background: #FFFDF7;
}
.day-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.day-head b { font-family: var(--font-round); font-weight: 400; font-size: 16px; color: #6B4A08; letter-spacing: 0; }
.day-head span { font-size: 11px; font-weight: 800; color: var(--ink-faint); }
.day-ev {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin: 0 0 5px;
  padding: 7px 9px;
  border-radius: 12px;
  border: 2px solid #F6EEDF;
  background: #fff;
  text-align: left;
  transition: transform .12s, box-shadow .18s;
}
.day-ev:last-child { margin-bottom: 0; }
.day-ev:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(150, 120, 80, .14); }
.day-ev.coral { border-left: 5px solid var(--coral); }
.day-ev.lavender { border-left: 5px solid var(--lav); }
.day-ev.sky { border-left: 5px solid var(--sky); }
.day-ev.sun { border-left: 5px solid var(--sun); }
.day-ev.mint { border-left: 5px solid var(--mint); }
.day-ev .de-time {
  flex: none;
  padding: 2px 7px;
  border-radius: 8px;
  background: #FFF1C9;
  color: #8A6412;
  font-size: 11.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.day-ev .de-title {
  flex: 1;
  min-width: 0;
  font-size: 13.5px;
  font-weight: 800;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.day-ev .de-type { font-size: 14px; line-height: 1; }
.day-none { padding: 3px 0; font-size: 12.5px; font-weight: 700; color: var(--ink-faint); }
.day-more { margin-top: 2px; font-size: 11px; font-weight: 800; color: var(--ink-faint); }
.day-go {
  width: 100%;
  padding: 9px;
  border-radius: 13px;
  border: 2px dashed #F2E1C4;
  background: #FFFBF2;
  color: #9A7442;
  font-size: 12px;
  font-weight: 800;
}

/* 🧹 정리시간 고르기 창 */
.qt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.qt-min {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 16px 8px 14px;
  border-radius: 20px;
  border: 3px solid #D7F0E4;
  background: linear-gradient(165deg, #F6FDF9, #FFFFFF);
  color: #2F6B52;
  box-shadow: 0 8px 18px rgba(120, 180, 150, .16);
}
.qt-min b { font-family: var(--font-round); font-weight: 400; font-size: 30px; line-height: 1; }
.qt-min span { font-size: 12px; font-weight: 800; color: #4F8A73; }
.qt-min:active { transform: scale(.97); }

@media (max-width: 860px) {
  .day-cols { grid-template-columns: 1fr; gap: 10px; }
}
@media (max-width: 719px) {
  .quick-bar { gap: 4px; }
  .qb-btn { padding: 7px 9px; }
  .qb-btn .qb-label { display: none; }
  .qb-btn .qb-ico { font-size: 16px; }
}
@media (max-width: 619px) {
  .day-card .mini-day { min-height: 28px; font-size: 11.5px; border-radius: 9px; }
  .day-card .mini-dow { font-size: 10px; padding-bottom: 4px; }
  .day-ev { padding: 6px 7px; }
  .day-ev .de-title { font-size: 13px; }
  .qt-min b { font-size: 26px; }
}

/* 패드·데스크톱: 한 화면(1024×768)에 다 들어오게
   왼쪽 = 남은 시간·게이지·버튼 / 오른쪽 = 큰 포켓몬 카드 */
@media (min-width: 780px) {
  .tidy-view {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr);
    grid-template-areas:
      "head head"
      "timer stage"
      "actions stage"
      "note stage";
    gap: 10px 14px;
    align-content: start;
    align-items: start;
  }
  .tv-head { grid-area: head; margin-bottom: 0; }
  .tv-timer { grid-area: timer; margin-bottom: 0; }
  .tv-stage { grid-area: stage; align-self: stretch; min-height: 300px; }
  .tv-actions { grid-area: actions; margin-top: 0; }
  .tv-note { grid-area: note; margin-top: 0; align-self: end; }
  .tv-left b { font-size: 54px; }
  .tv-mon img { width: 250px; height: 250px; }
  .tv-bubble { font-size: 25px; }
}

/* 폰(≤719): 상단 헤더가 줄바꿈으로 지저분해지지 않게 한 줄에 모읍니다 */
@media (max-width: 719px) {

}

/* 폰: 정리 화면이 한 화면에 가깝게 — 고르는 칩은 한 줄로 옆으로 밀어 봅니다 */
@media (max-width: 619px) {
  .tv-head { gap: 6px; }
  .tv-who { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .tv-who .chip { flex: none; }
  .tv-stage { min-height: 168px; }
  .tv-mon img { width: 136px; height: 136px; }
  .tv-bubble { font-size: 16px; }
  .tv-actions { margin-top: 8px; }
}

/* 폰: 머리 두 줄(브랜드+시계 / 모드)로 확실히 정리 */
@media (max-width: 719px) {
  .brand-text p { display: none; }
  .brand { flex: 0 1 auto; }
  .clock { flex: none; }
  .tbar-btn { padding: 7px 12px 9px; }
  .tbar-left { font-size: 28px; }
  .tbar-track { height: 16px; margin-top: 4px; }
}
@media (max-width: 619px) {
  .tv-timer { padding: 6px 12px 10px; margin-bottom: 8px; }
  .tv-left b { font-size: 36px; }
  .tv-left span { font-size: 14px; }
  .tv-track { height: 20px; margin: 8px 4px 0; }
  .tv-stage { min-height: 150px; }
  .tv-mon img { width: 124px; height: 124px; }
  .tv-bubble { font-size: 15.5px; padding: 6px 12px; }
  .tv-finish { min-height: 58px; font-size: 21px; }
  .tv-mini { min-height: 42px; }
}

/* 폰: 시계는 시간만 — 브랜드·바로가기·시계가 한 줄에 들어갑니다 */
@media (max-width: 719px) {
  .clock-date { display: none; }
  .clock { padding: 6px 10px; }
  .clock::before { font-size: 14px; }
  .clock-time { font-size: 16px; }
}

@media (max-width: 619px) {
  .tv-note { display: none; }
  .tv-actions { margin-top: 6px; }
  .tv-minis { margin-top: 6px; }
}

/* 폰: 그림은 조금 줄이고 버튼 네 개까지 한 화면에 */
@media (max-width: 619px) {
  .tv-h1t small { display: none; }
  .tv-stage { min-height: 134px; }
  .tv-mon img { width: 112px; height: 112px; }
  .tv-floor { width: 110px; height: 11px; margin-top: -7px; }
  .tbar-track { height: 14px; }
  .tbar-runner img { width: 26px; height: 26px; }
}

/* 폰: 헤더 간격을 줄여 브랜드·바로가기·시계가 확실히 한 줄에 */
@media (max-width: 719px) {
  .topbar { gap: 6px; padding: 8px 10px; }
  .qb-btn { padding: 6px 8px; gap: 3px; }
  .brand { gap: 7px; }
  .clock::before { content: none; }
}

/* =========================================================
   🏠 홈 개편 (2026-11-19)
   ---------------------------------------------------------
   · 날씨는 얇은 한 줄 띠 (중요한 정보 자리를 크게 비워 둡니다)
   · ① 오늘·내일 일정 + 미니 달력 ② 민국·이준 현황 ③ 민국 알림장
     세 가지가 홈 위쪽에서 바로 보이게 놓습니다.
   ========================================================= */

/* ---- 날씨 한 줄 띠 ---- */

  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  padding: 8px 12px;
  margin-bottom: 8px;
  border-radius: 18px;

  box-shadow: var(--shadow-sm);

}
.wx-strip.rain { background: linear-gradient(150deg, #EAF3FD, #FFFFFF 74%); border-color: #D8E6F6; }
.wx-strip.sun { background: linear-gradient(150deg, #FFF9E8, #FFFFFF 74%); border-color: #FBEBC6; }
.wx-strip.snow { background: linear-gradient(150deg, #F2FAFF, #FFFFFF 74%); border-color: #DEEDF8; }
.wx-strip.loading { justify-content: center; padding: 10px 12px; color: var(--ink-faint); }

.wx-s-now { display: flex; align-items: center; gap: 7px; min-width: 0; }
.wx-s-art { width: 28px; height: 28px; flex: none; }
.wx-s-art .wx-svg { width: 100%; height: 100%; display: block; }
.wx-s-temp {
  font-family: var(--font-round);
  font-size: 25px;
  line-height: 1;

  white-space: nowrap;
}
.wx-s-temp small { font-size: 13px; margin-left: 1px; }
.wx-s-txt { display: grid; line-height: 1.18; min-width: 0; }
.wx-s-txt b { font-size: 12.5px; color: #4B3A2B; font-weight: 800; white-space: nowrap; }
.wx-s-txt small { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); white-space: nowrap; }
.wx-s-place { font-size: 10.5px; font-weight: 800; color: var(--ink-faint); white-space: nowrap; }

.wx-s-dust {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
  background: #F4FAFF;
  border: 1.5px solid #E2EFFA;
  color: #4D7FA6;
  white-space: nowrap;
}
.wx-s-dust i { font-style: normal; font-size: 10px; }
.wx-s-dust b { font-weight: 800; }
.wx-s-dust.good { background: #E7F8EF; border-color: #CFEDDF; color: var(--mint-deep); }
.wx-s-dust.normal { background: #EAF3FE; border-color: #D3E6FA; color: var(--sky-deep); }
.wx-s-dust.bad { background: #FFF0E2; border-color: #F8DFC4; color: #B4711B; }

.wx-s-hours { display: flex; gap: 4px; margin-left: auto; }

  gap: 3px;
  padding: 3px 8px;
  border-radius: 999px;

  font-size: 10.5px;
  font-weight: 800;
  color: var(--ink-faint);
  white-space: nowrap;
}
.wx-s-hr i { font-style: normal; }
.wx-s-hr em { font-style: normal; font-size: 12px; line-height: 1; }
.wx-s-hr b { font-size: 11.5px; color: #3E6E93; }
.wx-s-hr.now { background: linear-gradient(160deg, #FFF7DE, #FFFFFF); border-color: #FBE3A8; color: #A5730E; }
.wx-s-hr.now b { color: #A5730E; }

.wx-s-tip {
  font-size: 10.5px;
  font-weight: 800;
  color: #8A6A3C;
  background: #FFF8E7;
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* ---- 엄마·아빠 지금 상태 (얇게) ---- */
.home-status { margin-bottom: 8px; }
.home-status .status-chip { padding: 6px 10px; border-radius: 16px; }
.home-status .sc-ava { width: 28px; height: 28px; font-size: 14px; }
.home-status .sc-txt b { font-size: 10.5px; }
.home-status .sc-txt small { font-size: 11.5px; }

/* ---- 홈 위쪽 세 칸: 일정 | 아이들 | 알림장 ---- */
.home-main {
  display: grid;
  grid-template-columns: minmax(0, 1.24fr) minmax(0, 1fr) minmax(0, .92fr);
  gap: 12px;
  align-items: start;
  margin-bottom: 12px;
}
.hm-col { display: grid; gap: 12px; align-content: start; min-width: 0; }

/* =========================================================
   🖥️ 패드 1화면 확정 개편 (2026-11-19 밤) — 참고 대시보드 IMG_7873 배치
   ---------------------------------------------------------
   ① 맨 위 1줄: 탭 + 아이/부모님 모드 + 그만! 알림 (로고는 작게)
   ② 홈에서만: 아주 큰 시계 + 📮우체통·🧹정리 세로 2개 + 2줄 날씨
   ③ 본문 두 열 — 왼쪽: 이번 달 달력 → 오늘·내일 일정 → 민국·이준 현황
                  오른쪽: 🏫 민국이 알림장(크게) → 엄마는 지금 · 아빠는 지금
   ========================================================= */

/* ---- ① 맨 위 한 줄 ---- */
.topstack {
  position: sticky;
  top: 0;
  z-index: 40;
  padding: 5px 8px;
  margin: 0 0 8px;
  background: #FFFCF5;
  border: 2px solid #FFF2DD;
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
}
.tabrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tabrow .brand { flex: none; }
.tabrow .brand-text p { display: none; }
.tabrow .tabs {
  position: static;
  top: auto;
  z-index: auto;
  flex: 1 1 auto;
  min-width: 0;
  padding: 0;
  margin: 0;
  gap: 4px;
  background: transparent;
  border-radius: 0;
  box-shadow: none;
  overflow-x: auto;
}
.tabrow .tab { padding: 6px 9px; font-size: 12px; gap: 4px; }
.tabrow .tab span { font-size: 13.5px; }
.tabrow .mode-bar { flex: none; gap: 5px; }
.tabrow .mode-switch { padding: 2px; }
.tabrow .mode-btn { padding: 6px 9px; font-size: 12px; gap: 3px; }
.tabrow .stop-timer, .tabrow .banner-btn { padding: 6px 10px; font-size: 12px; gap: 4px; }
.clock.mini { display: inline-flex; padding: 5px 9px; flex: none; }
.clock.mini .clock-time { font-size: 13px; }

/* ---- ② 홈 전용 큰 시계 + 날씨 ---- */
.hero { display: none; }
.hero-clock { display: flex; align-items: stretch; gap: 8px; flex: none; }
.clock.big {
  display: grid;
  gap: 1px;
  padding: 4px 14px 5px;
  border-radius: 16px;
  background: linear-gradient(160deg, #FFFCF3, #FFF1D6);
  border: 2px solid #FBE7BF;
  align-items: center;
}
.clock.big::before { content: none; }
.clock.big .clock-date { font-size: 12.5px; font-weight: 800; color: #9A7442; letter-spacing: 0; }
.clock.big .clock-time {
  font-family: var(--font-round);
  font-size: 38px;
  font-weight: 400;
  line-height: 1.02;
  color: #5C3E14;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.hero-quick { display: flex; flex-direction: column; gap: 5px; justify-content: center; }
.hero-quick .qb-btn { justify-content: flex-start; padding: 5px 11px; font-size: 12.5px; flex: 1; }

.wx-head { flex: 1 1 auto; min-width: 0; display: none; }
.wx-hero {
  display: grid;
  gap: 4px;
  height: 100%;
  align-content: center;
  padding: 5px 12px;
  border-radius: 16px;
  background: linear-gradient(150deg, #F1F9FF, #FFFFFF 72%);
  border: 2px solid #DCEDFB;
  min-width: 0;
}
.wx-hero.sun { background: linear-gradient(150deg, #FFFAEA, #FFFFFF 72%); border-color: #FBEBC6; }
.wx-hero.rain { background: linear-gradient(150deg, #EAF3FD, #FFFFFF 74%); border-color: #D8E6F6; }
.wx-hero.snow { background: linear-gradient(150deg, #F3FBFF, #FFFFFF 74%); border-color: #DEEDF8; }
.wx-hero.loading { color: var(--ink-faint); font-size: 12.5px; font-weight: 800; }
.wx-hero-line1, .wx-hero-line2 { display: flex; align-items: center; gap: 8px; min-width: 0; }

  display: inline-flex; align-items: center; gap: 3px;

}

.wx-h-dust.normal { background: #EAF3FE; border-color: #D3E6FA; color: var(--sky-deep); }

.wx-h-dust.worst { background: #FFE9E5; border-color: #F7D2CA; color: #C04A34; }

.wx-h-hours { display: flex; gap: 4px; min-width: 0; }
.wx-h-hr {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 7px; border-radius: 999px;
  background: rgba(255, 255, 255, .92); border: 1.5px solid #E3EFFA;
  font-size: 10.5px; font-weight: 800; color: var(--ink-faint); white-space: nowrap;
}
.wx-h-hr i { font-style: normal; }
.wx-h-hr em { font-style: normal; font-size: 11.5px; line-height: 1; }
.wx-h-hr b { font-size: 11.5px; color: #3E6E93; }

.wx-h-tip {

/* 패드(≥1000px): 홈에서만 둘째 줄을 펼칩니다 */
@media (min-width: 1000px) {

}

/* =========================================================

   ========================================================= */
.km-body { display: grid; align-content: center; gap: 8px; min-width: 0; flex: 1; }

@media (min-width: 1000px) {

/* ---- 엄마·아빠 카드: 위왼쪽 [아바타 제목] · 가운데 큰 상태 이모지 · 아래 상태 문구 ---- */

/* ---- 날씨 박스: 오른쪽 정렬은 유지하되 폭을 넓혀 시계·정리와 균형 맞추기 ---- */

   9차 — 홈 둘째 줄: [🏡 민국·이준이네] [큰 시계] [🧹 정리 / ⏰ 그만! 알림 2줄] [날씨]
   ========================================================= */

/* =========================================================
   10차 — ✅ 할 일: 네모 타일 그리드 (패드 3열 · 폰 2열), 타일 전체가 체크 버튼
   ========================================================= */
.routine-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 719px) {
  .routine-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.routine-item {
  position: relative;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 7px 5px 6px;
  border-radius: 14px;
  text-align: center;
  min-height: 58px;
}
.routine-item .r-main {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 100%;
  text-align: center;
}
.routine-item .r-emoji {
  width: auto; height: auto;
  background: none;
  font-size: 20px;
  line-height: 1;
}
.routine-item .r-label {
  flex: none;
  font-size: 12.5px;
  line-height: 1.2;
  text-align: center;
  word-break: keep-all;
}
.routine-check { display: none; }
.routine-item .r-time { font-size: 8.5px; margin-top: 1px; }
.routine-item.done {
  background: linear-gradient(160deg, #EAFBF2, #D5F5E4);
  border-color: #8FD9B6;
}
.routine-item.done::after {
  content: '✓';
  position: absolute;
  top: 3px; right: 6px;
  font-size: 12px; font-weight: 800; color: #2C8563;
}
.routine-item.done .r-label { color: #2C8563; }
.routine-item.locked {
  background: #F8F4EC;
  border-style: dashed;
}
.routine-item .routine-check.lock {
  display: grid !important;
  position: absolute;
  top: 2px; right: 4px;
  width: auto; height: auto;
  border: 0; background: none;
  font-size: 11px; color: #9A9086;
}
.r-nostar {
  position: absolute;
  top: 4px; left: 5px;
  font-size: 8px;
  padding: 0 3px;
  border-radius: 6px;
  background: #F3EEE6;
  color: #9A9086;
}
.r-del {
  position: absolute;
  bottom: 1px; right: 2px;
  width: 17px; height: 17px;
  border: 0; background: transparent;
  font-size: 9px; opacity: .55;
}
@media (min-width: 1000px) {
  .routine-item { min-height: 62px; padding: 8px 6px 7px; }
  .routine-item .r-emoji { font-size: 22px; }
  .routine-item .r-label { font-size: 13.5px; }
}

      nextDb = fs.getFirestore(app);
    }
    var nextRef = fs.doc(nextDb, COLLECTION, familyId);

    /* 여기서 문서를 실제로 읽어 봅니다 → 권한/DB 없음 오류를 이때 잡습니다.
       응답이 너무 늦으면 기다리지 않고 이 기기 저장으로 먼저 열어 줍니다. */
    var snap;
    try {
      snap = await withTimeout(fs.getDoc(nextRef), CONNECT_TIMEOUT_MS);
    } catch (e) {
      if (e && e.__timeout) throw new Error('서버 응답이 너무 늦어요. 잠시 뒤 다시 연결해 주세요');
      throw e;
    }
    var remoteDoc = snap.exists() ? snap.data() : null;
    var remoteState = (remoteDoc && remoteDoc.state) ? remoteDoc.state : null;
    /* 첫 구독 알림은 방금 읽은 그 내용이므로 '다른 기기에서 업데이트' 알림을 띄우지 않습니다 */
    if (remoteDoc && remoteDoc.updatedAt) lastSaved = remoteDoc.updatedAt;

    /* 성공한 뒤에야 이전 연결을 내리고 새 연결로 교체 */
    if (unsub) { try { unsub(); } catch (e) {} }
    unsub = null;

    db = nextDb;
    docRef = nextRef;
    fsApi = fs.setDoc;
    fsMod = fs;

    unsub = fs.onSnapshot(nextRef, function (s) {
      if (!s.exists()) return;
      if (s.metadata && s.metadata.hasPendingWrites) return;  // 내가 보낸 쓰기의 메아리
      var data = s.data();
      if (!data || !data.state) return;
      if (data.updatedAt && lastSaved && data.updatedAt === lastSaved) return;
      lastSaved = data.updatedAt || null;
      lastSyncAt = Date.now();
      lastError = null;
      writeLocal(data.state);
      if (remoteChange) remoteChange(data.state);
    }, function (e) {
      setError(e);
      if (remoteChange) remoteChange(null, errText(e));
    });

    /* 이 기기에 이미 데이터가 있고 원격이 비어 있으면 올려 줍니다 */
    if (!remoteState && opts.autoUpload !== false) {
      var local = readLocal();
      if (local) {
        lastSaved = Date.now();
        await fs.setDoc(nextRef, { state: local, updatedAt: lastSaved });
        lastSyncAt = Date.now();
      }
    }

    return { existed: !!remoteState, remote: remoteState, familyId: familyId };
  }

  function disconnect() {
    if (unsub) { try { unsub(); } catch (e) {} }
    unsub = null; db = null; docRef = null; fsApi = null; fsMod = null;
    clearTimeout(pushTimer); pushTimer = null; lastSaved = null;
    mode = 'local';
  }

  /* ---------------- 공개 API ---------------- */
  var Storage = {
    DEFAULT_FIREBASE_CONFIG: DEFAULT_FIREBASE_CONFIG,
    MIN_CODE_LEN: MIN_CODE_LEN,

    get mode() { return mode; },
    get config() { return config || currentConfig(); },
    get status() {
      var gate = readGate();
      return {
        mode: mode,
        error: lastError,
        lastSyncAt: lastSyncAt,
        projectId: (config || currentConfig()).projectId,
        familyId: gate ? gate.id : null,
        hasGate: !!gate,
        secure: secureContext()
      };
    },

    /* 이 기기가 가족 열쇠를 갖고 있는가 */
    hasGate() { return !!readGate(); },
    familyId() { var g = readGate(); return g ? g.id : null; },

    /* 입장 코드 → 문서 ID 계산 (저장은 하지 않음) */
    async docIdFor(code) {
      var norm = normalizeCode(code);
      if (norm.length < MIN_CODE_LEN) {
        throw new Error('가족 입장 코드는 ' + MIN_CODE_LEN + '자 이상이어야 해요');
      }
      var hex = await sha256Hex(SALT + '|' + norm);
      return PREFIX + hex.slice(0, HASH_LEN);
    },

    /* 잠금 화면에서 입장 코드를 넣었을 때: 이 기기에 열쇠를 새깁니다 */
    async enter(code) {
      var id = await Storage.docIdFor(code);
      var prev = readGate();
      writeGate({ id: id, at: Date.now(), v: 1 });
      return { id: id, changed: !prev || prev.id !== id };
    },

    /* 이 기기 잠그기(로그아웃) — 열쇠를 지우고, 클라우드에 있던 데이터는 이 기기에서 지웁니다 */
    lock(opts) {
      var wasCloud = mode === 'firebase';
      disconnect();
      writeGate(null);
      config = null;
      lastError = null;
      if (!opts || opts.clearLocal !== false) {
        writeLocal(null);
      }
      return { wasCloud: wasCloud };
    },

    /* 입장 코드 변경 — 새 문서에 연결까지 해 본 뒤에만 열쇠를 바꿉니다 */
    async changeCode(code) {
      var id = await Storage.docIdFor(code);
      var cfg = currentConfig();
      clearTimeout(pushTimer);
      var res = await connect(cfg, id, { autoUpload: false });
      writeGate({ id: id, at: Date.now(), v: 1 });
      config = cfg;
      mode = 'firebase';
      lastError = null;
      return res;
    },

    /* 앱 시작: 열쇠가 있으면 그 문서로 연결 */
    async init(onRemoteChange) {
      remoteChange = onRemoteChange || null;
      if (!readGate()) {
        disconnect();
        return { locked: true, mode: 'local', state: readLocal() };
      }
      config = currentConfig();
      try {
        var res = await connect(config, readGate().id);
        mode = 'firebase';
        lastError = null;
        lastSyncAt = lastSyncAt || Date.now();
        return { mode: 'firebase', state: res.remote || readLocal(), remote: res.remote, existed: res.existed };
      } catch (e) {
        setError(e);
        mode = 'local';
        return { mode: 'local', state: readLocal(), error: errText(e) };
      }
    },

    load() { return readLocal(); },

    save(state, opts) {
      writeLocal(state);                       // 항상 이 기기에도 저장 (오프라인 대비)
      if (mode !== 'firebase' || !fsApi || !docRef) return;
      var push = function () {
        lastSaved = Date.now();
        fsApi(docRef, { state: state, updatedAt: lastSaved }).then(function () {
          lastSyncAt = Date.now();
          lastError = null;
        }).catch(function (e) { setError(e); });
      };
      if (opts && opts.immediate) { clearTimeout(pushTimer); push(); return; }
      clearTimeout(pushTimer);
      pushTimer = setTimeout(push, 600);
    },

    /* (고급) Firebase 설정 직접 넣기 */
    async enableFirebase(cfg) {
      var gate = readGate();
      if (!gate) throw new Error('먼저 가족 입장 코드를 넣어 주세요');
      var merged = Object.assign({}, cfg);
      var res = await connect(merged, gate.id);
      config = merged;
      writeJSON(CFG_KEY, merged);
      mode = 'firebase';
      lastError = null;
      return res;
    },

    async disableFirebase() {
      disconnect();
      config = null;
      writeJSON(CFG_KEY, null);
    },

    /* 같은 브라우저의 다른 탭과 맞추기 */
    watchLocal(cb) {
      window.addEventListener('storage', function (e) {
        if (e.key === DOC_KEY && e.newValue) {
          try { cb(JSON.parse(e.newValue)); } catch (err) {}
        }
      });
    }
  };

  return Storage;
})();

</script>

<script>
/* 공용 UI 도우미 */
window.UI = (function () {
  var modalRoot = null;
  var toastRoot = null;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function uid(prefix) {
    return (prefix || 'id') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* 날짜 도우미 */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) {
    d = d ? new Date(d) : new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function parseKey(key) {
    var p = String(key).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  var WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function weekday(d) { return WEEKDAYS[(d ? new Date(d) : new Date()).getDay()]; }
  function dateKo(key) {
    var d = parseKey(key);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + weekday(d) + '요일';
  }
  function shortDateKo(key) {
    var d = parseKey(key);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }
  function timeKo(ts) {
    var d = new Date(ts);
    var h = d.getHours();
    var ampm = h < 12 ? '오전' : '오후';
    var hh = h % 12; if (hh === 0) hh = 12;
    return ampm + ' ' + hh + ':' + pad(d.getMinutes());
  }
  function ago(ts) {
    var diff = Date.now() - ts;
    var m = Math.floor(diff / 60000);
    if (m < 1) return '방금';
    if (m < 60) return m + '분 전';
    var h = Math.floor(m / 60);
    if (h < 24) return h + '시간 전';
    var d = Math.floor(h / 24);
    if (d < 7) return d + '일 전';
    return shortDateKo(dateKey(new Date(ts)));
  }
  function won(n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; }

  /* 토스트 */
  function toast(message, opts) {
    opts = opts || {};
    if (!toastRoot) toastRoot = document.getElementById('toastRoot');
    var el = document.createElement('div');
    el.className = 'toast' + (opts.kind ? ' toast-' + opts.kind : '');
    el.innerHTML = (opts.emoji ? '<span class="toast-emoji">' + opts.emoji + '</span>' : '') +
      '<span>' + esc(message) + '</span>';
    toastRoot.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 260);
    }, opts.duration || 2600);
  }

  /* 모달 */
  function modal(opts) {
    if (!modalRoot) modalRoot = document.getElementById('modalRoot');
    var wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    var actionsHtml = '';
    if (opts.actions && opts.actions.length) {
      actionsHtml = '<div class="modal-actions">' + opts.actions.map(function (a, i) {
        return '<button class="btn ' + (a.kind ? 'btn-' + a.kind : 'btn-soft') + '" data-action-index="' + i + '">' + esc(a.label) + '</button>';
      }).join('') + '</div>';
    }
    wrap.innerHTML =
      '<div class="modal-backdrop" data-close="1"></div>' +
      '<div class="modal ' + (opts.size ? 'modal-' + opts.size : '') + '" role="dialog" aria-modal="true">' +
        (opts.title ? '<div class="modal-head"><h3>' + esc(opts.title) + '</h3>' +
          '<button class="icon-btn" data-close="1" aria-label="닫기">✕</button></div>' : '') +
        '<div class="modal-body">' + (opts.bodyHTML || '') + '</div>' +
        actionsHtml +
      '</div>';
    modalRoot.appendChild(wrap);
    document.body.classList.add('modal-open');
    requestAnimationFrame(function () { wrap.classList.add('show'); });

    var closed = false;
    function close(result) {
      if (closed) return;
      closed = true;
      wrap.classList.remove('show');
      document.body.classList.remove('modal-open');
      setTimeout(function () { wrap.remove(); if (opts.onClose) opts.onClose(result); }, 200);
    }
    wrap.addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) { close(null); return; }
      var btn = e.target.closest('[data-action-index]');
      if (btn) {
        var a = opts.actions[Number(btn.getAttribute('data-action-index'))];
        if (a && a.onClick) {
          if (a.onClick(close) === false) return;
        }
        if (a && a.keepOpen) return;
        close(a ? a.value : null);
      }
    });
    if (opts.onOpen) opts.onOpen(wrap, close);
    var focusEl = opts.focus === false ? null : wrap.querySelector('input, textarea, button.btn');
    if (focusEl && window.innerWidth > 640) setTimeout(function () { focusEl.focus(); }, 60);
    return { el: wrap, close: close };
  }

  function confirm(title, message, confirmLabel, kind) {
    return new Promise(function (resolve) {
      modal({
        title: title,
        bodyHTML: '<p class="modal-text">' + esc(message) + '</p>',
        actions: [
          { label: confirmLabel || '확인', kind: kind || 'primary', onClick: function (close) { resolve(true); } },
          { label: '취소', kind: 'ghost', onClick: function (close) { resolve(false); } }
        ],
        onClose: function () { resolve(false); }
      });
    });
  }

  /* 반짝이 효과 */
  function confetti(count) {
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    document.body.appendChild(layer);
    var colors = ['#FFD166', '#FF9EC4', '#7BC9A6', '#A99BE0', '#7FB3E8', '#FF9E8A'];
    var n = count || 36;
    for (var i = 0; i < n; i++) {
      var bit = document.createElement('i');
      bit.style.left = Math.random() * 100 + '%';
      bit.style.background = colors[i % colors.length];
      bit.style.animationDelay = (Math.random() * 0.5) + 's';
      bit.style.animationDuration = (1.4 + Math.random() * 0.9) + 's';
      bit.style.width = (6 + Math.random() * 7) + 'px';
      bit.style.height = (8 + Math.random() * 10) + 'px';
      layer.appendChild(bit);
    }
    setTimeout(function () { layer.remove(); }, 2600);
  }

  /* 소리 내어 읽기 (우체통 편지) */
  function speak(text) {
    if (!('speechSynthesis' in window)) { toast('이 브라우저는 읽어주기를 지원하지 않아요'); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) { toast('읽어주기를 시작하지 못했어요'); }
  }

  return {
    $: $, $$: $$, esc: esc, uid: uid,
    dateKey: dateKey, parseKey: parseKey, weekday: weekday, dateKo: dateKo, shortDateKo: shortDateKo,
    timeKo: timeKo, ago: ago, won: won, pad: pad,
    toast: toast, modal: modal, confirm: confirm, confetti: confetti, speak: speak
  };
})();

</script>

<script>
/* =========================================================
   오늘 날씨 · 미세먼지 (Open-Meteo, API 키 없이 무료)
   - 위치: 서울 강남구 도곡동 (lat 37.4906, lon 127.0468)
   - 실패하면 조용히 넘어갑니다(앱에는 아무 영향 없음). 15분 캐시.
   ========================================================= */
window.Weather = (function () {
  'use strict';

  var CACHE_KEY = 'family-dashboard-weather';
  var CACHE_MS = 15 * 60 * 1000;
  var DATA_VERSION = 2;
  var LAT = 37.4882, LON = 127.0473;
  var PLACE = '도곡동';
  var URL_NOW = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m' +
    '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&timezone=Asia%2FSeoul&forecast_days=2';
  var URL_AIR = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + LAT + '&longitude=' + LON +
    '&current=pm10,pm2_5&timezone=Asia%2FSeoul';

  var mem = null;        // { at, data }
  var pending = null;

  var SKY = {
    0: { label: '맑음', kind: 'sun' },
    1: { label: '대체로 맑음', kind: 'sun' },
    2: { label: '구름 조금', kind: 'cloud' },
    3: { label: '흐림', kind: 'cloud' },
    45: { label: '안개', kind: 'cloud' }, 48: { label: '안개', kind: 'cloud' },
    51: { label: '이슬비', kind: 'rain' }, 53: { label: '이슬비', kind: 'rain' }, 55: { label: '이슬비', kind: 'rain' },
    56: { label: '어는 이슬비', kind: 'rain' }, 57: { label: '어는 이슬비', kind: 'rain' },
    61: { label: '비', kind: 'rain' }, 63: { label: '비', kind: 'rain' }, 65: { label: '강한 비', kind: 'rain' },
    66: { label: '어는 비', kind: 'rain' }, 67: { label: '어는 비', kind: 'rain' },
    71: { label: '눈', kind: 'snow' }, 73: { label: '눈', kind: 'snow' }, 75: { label: '많은 눈', kind: 'snow' },
    77: { label: '눈발', kind: 'snow' },
    80: { label: '소나기', kind: 'rain' }, 81: { label: '소나기', kind: 'rain' }, 82: { label: '센 소나기', kind: 'rain' },
    85: { label: '소낙눈', kind: 'snow' }, 86: { label: '소낙눈', kind: 'snow' },
    95: { label: '천둥번개', kind: 'rain' }, 96: { label: '천둥번개', kind: 'rain' }, 99: { label: '천둥번개', kind: 'rain' }
  };

  function readCache() {
    try {
      var v = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (v && v.at && v.data && v.data.version === DATA_VERSION) return v;
    } catch (e) {}
    return null;
  }
  function writeCache(obj) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(obj)); } catch (e) {}
  }

  function gradeOf(pm10, pm25) {
    /* 환경부 기준: PM10 30/80/150, PM2.5 15/35/75 */
    var g10 = grade1(pm10, 30, 80, 150);
    var g25 = grade1(pm25, 15, 35, 75);
    return Math.max(g10, g25);
  }
  function grade1(v, a, b, c) {
    if (typeof v !== 'number' || isNaN(v)) return 1;
    if (v <= a) return 0;
    if (v <= b) return 1;
    if (v <= c) return 2;
    return 3;
  }
  var GRADES = [
    { key: 'good', label: '좋음', ico: '😊', cls: 'good' },
    { key: 'normal', label: '보통', ico: '🙂', cls: 'normal' },
    { key: 'bad', label: '나쁨', ico: '😷', cls: 'bad' },
    { key: 'worst', label: '매우나쁨', ico: '😨', cls: 'worst' }
  ];

  function tipFor(kind, tmax, tmin, grade) {
    if (kind === 'rain') return '우산 챙겨요 ☂';
    if (kind === 'snow') return '길 미끄러워요, 단단히 입어요 ❄';
    if (grade >= 2) return '마스크 챙겨요 😷';
    if (typeof tmax === 'number' && tmax >= 28) return '시원하게 입어요 🧊';
    if (typeof tmax === 'number' && tmax <= 4) return '두꺼운 겉옷 챙겨요 🧥';
    if (typeof tmax === 'number' && tmax <= 11) return '겉옷 한 장 챙겨요 🧥';
    if (typeof tmin === 'number' && typeof tmax === 'number' && tmax - tmin >= 9) return '아침저녁 쌀쌀해요 🧣';
    return '나들이하기 딱 좋아요 🌷';
  }

  function compose(now, air) {
    var cur = (now && now.current) || {};
    var day = (now && now.daily) || {};
    var code = Number(cur.weather_code);
    var sky = SKY[code] || { label: '날씨', kind: 'cloud' };
    var tmax = day.temperature_2m_max ? day.temperature_2m_max[0] : null;
    var tmin = day.temperature_2m_min ? day.temperature_2m_min[0] : null;
    var pop = day.precipitation_probability_max ? day.precipitation_probability_max[0] : null;
    var a = (air && air.current) || {};
    var pm10 = typeof a.pm10 === 'number' ? a.pm10 : null;
    var pm25 = typeof a.pm2_5 === 'number' ? a.pm2_5 : null;
    var g = pm10 == null && pm25 == null ? null : gradeOf(pm10, pm25);
    var kind = sky.kind;
    if (kind === 'sun' && pop >= 60) kind = 'rain';
    var hum = typeof cur.relative_humidity_2m === 'number' ? Math.round(cur.relative_humidity_2m) : null;
    var hours = buildHours(now);
    return {
      version: DATA_VERSION,
      place: PLACE,
      temp: typeof cur.temperature_2m === 'number' ? Math.round(cur.temperature_2m) : null,
      feels: typeof cur.apparent_temperature === 'number' ? Math.round(cur.apparent_temperature) : null,
      tmax: typeof tmax === 'number' ? Math.round(tmax) : null,
      tmin: typeof tmin === 'number' ? Math.round(tmin) : null,
      pop: typeof pop === 'number' ? pop : null,
      hum: hum,
      label: sky.label,
      kind: kind,
      hours: hours,
      pm10: pm10 == null ? null : Math.round(pm10),
      pm25: pm25 == null ? null : Math.round(pm25),
      pm10Grade: pm10 == null ? null : GRADES[grade1(pm10, 30, 80, 150)],
      pm25Grade: pm25 == null ? null : GRADES[grade1(pm25, 15, 35, 75)],
      grade: g == null ? null : GRADES[g],
      tip: g == null ? '오늘도 좋은 하루!' : tipFor(kind, tmax, tmin, g),
      at: Date.now()
    };
  }

  /* 앞으로의 시간대별 예보 — 지금부터 3시간 간격으로 6칸 */
  function buildHours(now) {
    var h = (now && now.hourly) || {};
    var times = h.time || [];
    if (!times.length) return [];
    var temps = h.temperature_2m || [];
    var codes = h.weather_code || [];
    var pops = h.precipitation_probability || [];
    var days = h.is_day || [];
    var nowMs = Date.now();
    var start = 0;
    for (var i = 0; i < times.length; i++) {
      var t = new Date(times[i]).getTime();
      if (t + 30 * 60 * 1000 >= nowMs) { start = i; break; }
    }
    var out = [];
    var dayKey = function (d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
    var todayStr = dayKey(new Date());
    for (var k = 0; k < 6; k++) {
      var idx = start + k * 3;
      if (idx >= times.length) break;
      var dt = new Date(times[idx]);
      if (isNaN(dt.getTime())) continue;
      var c = Number(codes[idx]);
      var sk = SKY[c] || { label: '날씨', kind: 'cloud' };
      var pp = typeof pops[idx] === 'number' ? Math.round(pops[idx]) : null;
      out.push({
        hour: dt.getHours(),
        now: k === 0,
        tomorrow: dayKey(dt) !== todayStr,
        temp: typeof temps[idx] === 'number' ? Math.round(temps[idx]) : null,
        pop: pp,
        day: days[idx] == null ? null : Number(days[idx]) === 1,
        kind: sk.kind,
        label: sk.label
      });
    }
    return out;
  }

  function fetchJSON(url) {
    if (!window.fetch) return Promise.reject(new Error('no fetch'));
    return window.fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r || !r.ok) throw new Error('weather ' + (r && r.status));
      return r.json();
    });
  }

  function refresh() {
    if (pending) return pending;
    pending = fetchJSON(URL_NOW).then(function (now) {
      return fetchJSON(URL_AIR).then(function (air) {
        return compose(now, air);
      }, function () {
        return compose(now, null);       // 미세먼지만 실패해도 날씨는 보여 줍니다
      });
    }).then(function (data) {
      mem = { at: Date.now(), data: data };
      writeCache(mem);
      pending = null;
      return data;
    }).catch(function () {
      pending = null;
      return null;
    });
    return pending;
  }

  /* 즉시 보여 줄 수 있는 값(캐시) */
  function cached() {
    if (mem && Date.now() - mem.at < CACHE_MS) return mem.data;
    var c = readCache();
    if (c && Date.now() - c.at < CACHE_MS) { mem = c; return c.data; }
    return null;
  }

  /* cb(data) — 캐시가 있으면 바로, 없으면 받은 뒤 한 번 더 */
  function load(cb) {
    var c = cached();
    if (c) { cb(c); }
    refresh().then(function (data) {
      if (data) cb(data);
    });
  }

  return {
    load: load,
    cached: cached,
    refresh: refresh,
    gradeList: GRADES
  };
})();

</script>
<script>
/* =========================================================
   우리집 다모아 · 폰·패드 잠금화면 알림 (ntfy.sh)
   ---------------------------------------------------------
   · 별도 서버 없이 ntfy.sh 공개 푸시 서비스를 씁니다.
   · 우리 가족 토픽 이름은 '가족 열쇠 ID(fam_...)'를 SHA-256으로
     해시한 앞 16자리입니다. 같은 가족 코드를 넣은 기기는

    /* 부모님이 고친 할 일 (아침·저녁) */
    s.customRoutines = {};    D.children.forEach(function (c) {
      var cur = raw.customRoutines && raw.customRoutines[c.id];
      if (!cur || typeof cur !== 'object') return;
      if (!Array.isArray(cur.morning) && !Array.isArray(cur.evening)) return;
      var norm = function (arr) {
        return (Array.isArray(arr) ? arr : []).map(function (it) {
          if (!it) return null;
          if (typeof it === 'string') return { id: UI.uid('rt'), label: it, emoji: '⭐' };
          var label = String(it.label || '').trim();
          if (!label) return null;
          var out = { id: it.id || UI.uid('rt'), label: label.slice(0, 24), emoji: String(it.emoji || '⭐').slice(0, 4) };
          /* ⭐ 별 없는 체크(알림장 체크) — 이 플래그는 꼭 살려 둡니다 */
          if (it.noStar === true || it.noStar === 1 || it.noStar === 'true' || it.id === 'mg-e-notice') out.noStar = true;
          return out;
        }).filter(Boolean);
      };
      s.customRoutines[c.id] = { morning: norm(cur.morning), evening: norm(cur.evening) };
    });

    /* ⏰ 2026-11-19: 아침 할 일 맨 앞에 '스스로 일어나기'가 새로 들어갔어요.
       가족 문서에 예전 기본 4개가 그대로 저장돼 있으면 새 기본값(5개)으로 바꿔 줍니다.
       부모님이 직접 고친 목록은 건드리지 않아요. */
    var legacyMorning = {
      minguk: ['mg-m-wash', 'mg-m-dress', 'mg-m-break', 'mg-m-bag'],
      ijun: ['ij-m-wash', 'ij-m-dress', 'ij-m-break', 'ij-m-bag']
    };
    D.children.forEach(function (c) {
      var cur = s.customRoutines[c.id];
      if (!cur || !Array.isArray(cur.morning)) return;
      var ids = cur.morning.map(function (i) { return i.id; });
      var leg = legacyMorning[c.id] || [];
      if (!leg.length || ids.length !== leg.length) return;
      if (!leg.every(function (id, i) { return ids[i] === id; })) return;
      cur.morning = ((D.routines[c.id] || {}).morning || []).map(function (i) {
        return { id: i.id, label: i.label, emoji: i.emoji };
      });
    });

    /* ⭐ 식판 퀵메뉴 (부모님이 등록한 자주 먹는 메뉴)
       예전 가족 문서에는 없는 값이라 없으면 비어 있어요. 기본 음식(foods)과
       id 가 겹치면 기본 음식이 우선이 되니 새 id 로 바꿔 둡니다. */
    var seenQuick = {};
    s.mealQuick = (Array.isArray(raw.mealQuick) ? raw.mealQuick : []).map(function (q) {
      if (!q || typeof q !== 'object') return null;
      var name = String(q.name || q.label || '').replace(/\s+/g, ' ').trim();
      if (!name) return null;
      name = name.slice(0, 16);
      var id = String(q.id || '').trim();
      if (!id || seenQuick[id] || D.foods.some(function (f) { return f.id === id; })) id = UI.uid('qm');
      seenQuick[id] = true;
      var slot = String(q.slot || '');
      if (!D.traySlots.some(function (t) { return t.key === slot; })) slot = D.traySlots[2] ? D.traySlots[2].key : 'side1';
      return {
        id: id,
        name: name,
        emoji: String(q.emoji || '').trim().slice(0, 8) || '🍽️',
        slot: slot,
        ingredients: (Array.isArray(q.ingredients) ? q.ingredients : [])
          .map(function (x) { return String(x == null ? '' : x).replace(/\s+/g, ' ').trim().slice(0, 10); })
          .filter(Boolean).slice(0, 6)
      };
    }).filter(Boolean).slice(0, 40);

    return s;
  }

    if (!alerts().sound) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = new AC();
      var t0 = ctx.currentTime;
      [880, 1174].forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + i * 0.16);
        g.gain.exponentialRampToValueAtTime(0.16, t0 + i * 0.16 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.16 + 0.34);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0 + i * 0.16); o.stop(t0 + i * 0.16 + 0.4);
      });
      setTimeout(function () { try { ctx.close(); } catch (e) {} }, 1400);
    } catch (e) {}
  }

  /* ================= 📲 폰·패드 잠금화면 알림 (ntfy) =================

     가족 토픽은 가족 열쇠 ID로만 만들어지고, 발송은 ntfy.sh JSON 발송을 씁니다.

  var NT = window.Ntfy || null;
  function ntfyOn() { return !S || S.ntfyPush !== false; }
  function ntfyTopicName() { return NT ? NT.topic() : ''; }
  function ntfyShort(text, n) {
    var s = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
    n = n || 120;
    return s.length > n ? s.slice(0, n - 1) + '…' : s;

  function pushToPhones(title, body, extra) {

    var p;
    try {
      p = NT.notify(Object.assign({ title: title, message: body }, extra || {}));
    } catch (e) {
      return Promise.resolve({ ok: false, error: String((e && e.message) || e) });

  /* ① 우체통 가족방에 새 메시지(그림 편지·답장)가 저장된 뒤에 부릅니다. */

  function statusLabel(st) {

  function setStatus(id, key, text) {

  function ackBanner() {
    var b = S && S.bannerPopup;
    if (!b) { hideBannerPopup(); return; }
    var d = device();
    var kid = b.to && b.to !== 'all' ? D.children.filter(function (c) { return c.id === b.to; })[0] : null;
    var name = kid ? kid.name : d.name;
    b.ackedBy = Array.isArray(b.ackedBy) ? b.ackedBy : [];
    var already = b.ackedBy.some(function (a) { return a && a.dev === d.id; });
    if (!already) b.ackedBy.push({ dev: d.id, name: name, at: Date.now() });
    save();
    render({ keepScroll: true });
    hideBannerPopup();
    UI.toast('확인했어요! 부모님께 알려드렸어요', { emoji: '✅', kind: 'good' });
  }

  /* ---- 팝업(빵! 메시지 · 새 편지) ---- */
  function popupRoot() { return document.getElementById('popupRoot'); }
  function hideBannerPopup() {
    var el = document.querySelector('.bigpop-layer');
    if (el && el.parentNode) el.parentNode.removeChild(el);

    var who = b.from || '부모님';

        '<div class="bp-ico" aria-hidden="true">💌</div>' +
        '<p class="bp-from">' + esc(line) + '</p>' +
        '<p class="bp-msg">' + esc(b.message) + '</p>' +
        '<button type="button" class="bp-ok" data-pop="banner-ack">확인했어요</button>' +
        '<p class="bp-help">누르면 부모님 화면에 읽음으로 표시돼요</p>' +
      '</div>';
    var root = popupRoot();
    if (!root) return;
    root.appendChild(el);

  function maybeShowBanner() {
    var b = S && S.bannerPopup;
    if (!b) { hideBannerPopup(); if (shownBanner) shownBanner = null; return; }
    if (shownBanner === b.id) return;
    shownBanner = b.id;
    var d = device();
    var acked = (b.ackedBy || []).some(function (a) { return a && a.dev === d.id; });
    if (acked) return;
