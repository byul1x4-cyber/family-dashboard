<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>다모아 미리보기(임시)</title>
<style>
html,body{margin:0;background:#E8E4DC;font:700 12px/1.4 system-ui,sans-serif;color:#555}
.frames{display:flex;gap:18px;padding:14px;align-items:flex-start;flex-wrap:wrap}
.frame{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.frame>b{display:block;padding:6px 10px;background:#F6F2EA;font-weight:800}
.frame iframe{display:block;border:0;background:#FFF7EC}
</style></head>
<body>
<div class="frames">
  <div class="frame" id="padRoutine"><b>PAD 1024×768 · 할 일(08:15)</b>
    <iframe id="fPadRoutine" src="app.html?mode=child&at=08:15:00&seed=half&b=60" width="1024" height="768"></iframe></div>
  <div class="frame" id="padHome"><b>PAD 1024×768 · 홈(08:15)</b>
    <iframe id="fPadHome" src="app.html?mode=child&at=08:15:00&seed=half&b=60" width="1024" height="768" data-go="home"></iframe></div>
  <div class="frame" id="moRoutine"><b>PHONE 390×844 · 할 일(08:15)</b>
    <iframe id="fMoRoutine" src="app.html?mode=child&at=08:15:00&seed=half&b=60" width="390" height="844"></iframe></div>
  <div class="frame" id="moHome"><b>PHONE 390×844 · 홈(08:15)</b>
    <iframe id="fMoHome" src="app.html?mode=child&at=08:15:00&seed=half&b=60" width="390" height="844" data-go="home"></iframe></div>
</div>
<script>
/* data-go="home" 인 프레임은 홈 탭으로 옮겨 둡니다 */
(function () {
  var tries = 0;
  var t = setInterval(function () {
    var pending = 0;
    document.querySelectorAll('iframe[data-go]').forEach(function (f) {
      if (f.__done) return;
      try {
        var doc = f.contentDocument;
        var tab = doc && doc.querySelector('.tab[data-view="' + f.getAttribute('data-go') + '"]');
        if (tab) { tab.click(); f.__done = true; }
        else pending++;
      } catch (e) { pending++; }
    });
    if (!pending || ++tries > 100) clearInterval(t);
  }, 150);
})();
</script>
</body></html>
